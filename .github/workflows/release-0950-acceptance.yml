name: v0.9.50 Android acceptance
on:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths: ['app/**', 'scripts/run_release0950_acceptance.sh', 'scripts/prepare_emulator_ui.py', 'scripts/tests/test_prepare_emulator_ui.py', 'scripts/prepare_emulator_action.py', 'scripts/tests/test_prepare_emulator_action.py', 'scripts/tests/fixtures/android-emulator-runner-a421/**', 'scripts/select_android_test_apk.py', 'scripts/tests/test_select_android_test_apk.py', '.github/workflows/release-0950-acceptance.yml']
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'release-scope.json'
      - 'scripts/run_release0950_acceptance.sh'
      - 'scripts/prepare_emulator_ui.py'
      - 'scripts/tests/test_prepare_emulator_ui.py'
      - 'scripts/prepare_emulator_action.py'
      - 'scripts/tests/test_prepare_emulator_action.py'
      - 'scripts/tests/fixtures/android-emulator-runner-a421/**'
      - 'scripts/select_android_test_apk.py'
      - 'scripts/tests/test_select_android_test_apk.py'
      - '.github/workflows/release-0950-acceptance.yml'
      # Recovery-only code revisions still require both Android emulator gates.
      - '.github/workflows/recover-verified-android144-gateway18.yml'
      - 'scripts/recover_release_publication.py'
      - 'scripts/verify_published_release.py'
      - 'release-recovery.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-0950-${{ github.event.pull_request.number || github.ref }}
  # Finish the active PR revision. The concurrency group keeps the latest pending revision.
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}
env:
  ISSUE_REPORT_ORIGIN: ${{ vars.ISSUE_REPORT_ORIGIN }}
  ISSUE_REPORT_GITHUB_ENABLED: ${{ vars.ISSUE_REPORT_GITHUB_ENABLED || 'true' }}
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api: 34
            profile: pixel_2
            # AOSP Launcher3 avoids the cold Google Pixel Launcher ANR observed
            # before instrumentation on the API 34 google_apis guest (run 43822499387).
            # Keep Google APIs coverage on API 36; never ignore process errors.
            target: default
          - api: 36
            profile: pixel_c
            target: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Provision verified memory model outside Gradle
        run: python3 scripts/provision_memory_model.py
      - run: sudo chmod 666 /dev/kvm
      - name: Install Vulkan build prerequisites
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh
      # Release code-generation heaps before compiling production and test sources.
      # The device is x86_64; distribution APK/native workflows cover other ABIs.
      - name: Generate device regression KSP sources
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 540 -- :app:kspDebugKotlin \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            2>&1 | tee acceptance-ksp.log
      - name: Generate device regression KAPT sources
        timeout-minutes: 22
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 1200 -- :app:kaptDebugKotlin \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            2>&1 | tee acceptance-kapt.log
      - name: Compile device regression production sources in a fresh process
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          # Run 45100661888 exhausted the isolated 4 GiB compiler heap before
          # device startup. Verify RAM/cgroup headroom for this fixed 6 GiB cap.
          python3 scripts/check_android_compile_memory.py | tee acceptance-production-memory.log
          python3 scripts/gradle_retry.py --timeout-seconds 1140 -- :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Xlog:gc:file=${RUNNER_TEMP}/acceptance-production-gc.log:time,level,tags:filecount=2,filesize=8M" \
            2>&1 | tee acceptance-production.log
      - name: Generate device regression instrumentation sources
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 840 -- :app:kspDebugAndroidTestKotlin \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            2>&1 | tee acceptance-instrumentation-ksp.log
      - name: Generate device regression instrumentation annotations
        timeout-minutes: 15
        shell: bash
        # Stub generation executes even when the AndroidTest KAPT processor is skipped.
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 840 -- :app:kaptGenerateStubsDebugAndroidTestKotlin :app:kaptDebugAndroidTestKotlin \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            2>&1 | tee acceptance-instrumentation-kapt.log
      - name: Compile device regression tests in a fresh process
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 1440 -- :app:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestJavaWithJavac \
            -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' \
            2>&1 | tee acceptance-instrumentation-compile.log
      - name: Package device regression APKs in a fresh process
        timeout-minutes: 25
        # Release KSP/compiler heaps before native-library compression. ApkFlinger
        # uses the common pool independently of Gradle's worker limit.
        run: >-
          python3 scripts/gradle_retry.py -- :app:assembleDebug :app:assembleDebugAndroidTest
          -Pandroid.injected.build.abi=x86_64 --no-daemon --max-workers=1 --console=plain --stacktrace
          "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
          -Djava.util.concurrent.ForkJoinPool.common.parallelism=1
          -Xlog:gc:file=${RUNNER_TEMP}/acceptance-package-gc.log:time,level,tags -Dfile.encoding=UTF-8"
      - name: Verify compatible device APK artifacts before booting
        run: |
          python3 scripts/select_android_test_apk.py app/build/intermediates/apk/debug --application-id dev.melo.gptmobile.improved --abi x86_64
          python3 scripts/select_android_test_apk.py app/build/intermediates/apk/androidTest/debug --application-id dev.melo.gptmobile.improved.test
      # Keep the reviewed upstream action and its SDK/AVD/cleanup implementation.
      # Its early MENU key caused cold Pixel Launcher ANRs before our readiness
      # checks could run. Verify and remove only that call before loading it.
      - name: Check out the pinned emulator action outside application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: build/emulator-action-upstream
          persist-credentials: false
      - name: Verify the emulator action and remove premature boot input
        run: python3 scripts/prepare_emulator_action.py build/emulator-action-upstream --output app/build/acceptance-0950/emulator-action-patch.json
      - name: Run editor and Combined finalization regressions and measure database/catalog operations
        uses: ./build/emulator-action-upstream
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          # Keep both cold boots' existing CPU and memory headroom.
          # API 34's two-core/2560MB guest hit a launcher ANR with heavy CPU/paging load.
          cores: 4
          ram-size: 4096M
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ACCEPTANCE_EMULATOR_API=${{ matrix.api }} ACCEPTANCE_EMULATOR_TARGET=${{ matrix.target }} bash scripts/run_release0950_acceptance.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          retention-days: 14
          name: acceptance-0950-api${{ matrix.api }}-${{ matrix.profile }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/acceptance-0950/
            app/build/outputs/apk/**/output-metadata.json
            app/build/intermediates/apk/**/output-metadata.json
            acceptance-*.log
            ${{ runner.temp }}/acceptance-production-gc.log*
            ${{ runner.temp }}/acceptance-package-gc.log
