name: UI Review APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ui-review-apk.yml'
      - 'macrobenchmark/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-review-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    name: Build draft review APK
    runs-on: ubuntu-latest
    env:
      OBX_DISABLE_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Build APK and compile device regressions
        run: ./gradlew :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:compileBenchmarkKotlin :macrobenchmark:compileBenchmarkKotlin --no-daemon --stacktrace
      - name: Verify packaged local runtime and privacy
        run: |
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: draft-review-apk-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Review instructions
        run: |
          echo 'Download the draft-review-apk artifact below for this exact commit. Device verification is still required; compiling instrumentation tests does not execute them.' >> "$GITHUB_STEP_SUMMARY"
