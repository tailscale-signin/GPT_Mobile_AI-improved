name: Prepare reconciled diagnostic repair
on:
  push:
    branches: [fix/diagnostic-workflow-evidence-2026-11-06]
    paths:
      - '.diagnostic-repair/**'
      - '.github/workflows/diagnostic-reconciliation-preparation.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact parent and reviewed patch before applying
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 34aeba6c5df941d23c31840c377c65d6cd585e2e
          python3 .diagnostic-repair/decode.py
          git apply --check diagnostic-reconciled.patch
          git apply diagnostic-reconciled.patch
          git add -N app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/github/GitHubDispatchObservationTest.kt app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/github/GitHubGraphQlMutationRecoveryTest.kt
          git diff --check
      - name: Format and check changed Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/diagnostic-ktlint"
          mapfile -d '' files < <(git diff --name-only -z -- 'app/src/**/*.kt')
          java -jar "$RUNNER_TEMP/diagnostic-ktlint" --format "${files[@]}"
          java -jar "$RUNNER_TEMP/diagnostic-ktlint" "${files[@]}"
      - name: Prepare commit object without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .diagnostic-repair/prepare.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: prepared-reconciled-repair
          path: |
            diagnostic-reconciled.patch
            diagnostic-payload.b64
            diagnostic-prepared.patch
            diagnostic-prepared.json
            diagnostic-prepared-source.tar.gz
          retention-days: 1
          if-no-files-found: error
