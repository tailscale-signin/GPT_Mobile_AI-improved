name: Prepare diagnostic repair commit

on:
  push:
    branches: [fix/diagnostic-workflow-evidence-2026-11-06]
    paths:
      - '.diagnostic-repair/**'
      - '.github/workflows/diagnostic-apply-repair.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply the reviewed edits against the exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b84e310beb9f10493ce0a994356fae59c81d57ea
          python3 .diagnostic-repair/phase1.py
          python3 .diagnostic-repair/phase2.py
          python3 .diagnostic-repair/phase3.py
          python3 .diagnostic-repair/tests.py
          git add -N app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/github/GitHubRefAvailability.kt app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/github/GitHubRefAvailabilityTest.kt
          git -c core.abbrev=7 diff --binary -- app/src > diagnostic-applied.patch
          echo '28af7c1c8674ad9279cd1d663bbb536314171e88a768315c232bed1aaa0a2689  diagnostic-applied.patch' | sha256sum --check
          git diff --check
      - name: Format and check only the changed Kotlin sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/diagnostic-ktlint"
          mapfile -d '' files < <(git diff --name-only -z -- 'app/src/**/*.kt')
          java -jar "$RUNNER_TEMP/diagnostic-ktlint" --format "${files[@]}"
          java -jar "$RUNNER_TEMP/diagnostic-ktlint" "${files[@]}"
      - name: Prepare a commit object without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .diagnostic-repair/prepare.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: prepared-diagnostic-repair
          path: |
            diagnostic-applied.patch
            diagnostic-prepared.patch
            diagnostic-prepared.json
            diagnostic-prepared-source.tar.gz
          retention-days: 1
          if-no-files-found: error
