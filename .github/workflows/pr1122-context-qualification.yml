name: PR 1122 context qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr1122-context-qualification.yml'

permissions:
  contents: read

concurrency:
  group: pr1122-context-qualification
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.number == 1122 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/github-context-and-voice-reliability-2026-11-14'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply exact guarded contract corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path.cwd()
          main = 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/'
          test = 'app/src/test/kotlin/dev/chungjungsoo/gptmobile/'
          touched = set()
          def replace(path, old, new):
              file = root / path
              value = file.read_text()
              if value.count(old) != 1:
                  raise SystemExit('Expected one original contract in ' + path)
              file.write_text(value.replace(old, new))
              touched.add(path)
          replace(main + 'data/agent/ProgressiveToolCatalog.kt',
              '                taskRequired + ranked(task).filter {\n                    (initialNames == null || it.name in initialNames) &&\n                        dev.chungjungsoo.gptmobile.data.agent.tool.GitHubOperationTool.operationName(it.name) !in deferredEngineering\n                }\n',
              '                taskRequired + ranked(task).filter {\n                    (initialNames == null || it.name in initialNames) &&\n                        dev.chungjungsoo.gptmobile.data.agent.tool.GitHubOperationTool.operationName(it.name) !in deferredEngineering\n                } + if (taskRequired.none(::isGitHubTool)) {\n                    candidates.values.filter { isGitHubTool(it) && (initialNames == null || it.name in initialNames) }\n                } else {\n                    emptyList()\n                }\n')
          replace(main + 'data/agent/ProgressiveToolCatalog.kt',
              '            // GitHub and other schemas obey the same bounded selection window.\n            val cost = schemaTokens(tool)\n            val reason = when {\n                cost + 256 > schemaAllowance -> "SCHEMA_TOO_LARGE"\n                selected.size >= toolAllowance -> "TOOL_COUNT_WINDOW"\n                tokens + cost > schemaAllowance -> "SCHEMA_WINDOW_BUDGET"',
              '            // An individual authorized GitHub schema may exceed the soft discovery\n            // window. Hard provider context admission still precedes all dispatch.\n            val cost = schemaTokens(tool)\n            val singleGitHubContract = githubUpfront && isGitHubTool(tool) && selected.all { it.name == "read_recovery_context" }\n            val reason = when {\n                cost + 256 > schemaAllowance && !singleGitHubContract -> "SCHEMA_TOO_LARGE"\n                selected.size >= toolAllowance -> "TOOL_COUNT_WINDOW"\n                tokens + cost > schemaAllowance && !singleGitHubContract -> "SCHEMA_WINDOW_BUDGET"')
          replace(main + 'data/agent/ToolCatalogAdmission.kt',
              '    ToolCatalogDiagnostics.recordOmissions("provider_round", omitted)\n    return selected',
              '    ToolCatalogDiagnostics.recordOmissions("provider_round", omitted)\n    if (limits.githubMode && !discoveryFits && visible.any { it.name in omitted && ProgressiveToolCatalog.isGitHubTool(it) }) {\n        val needed = visible.filter { ProgressiveToolCatalog.isGitHubTool(it) || it.name in requiredNames }\n            .sumOf { providerSchemaTokens(it, limits.githubMode) }\n        throw GitHubToolContextBudgetException(needed, budget.available, budget)\n    }\n    return selected')
          replace(main + 'data/context/LocalContextPlanner.kt',
              '        return tools.filter { tool ->\n            val operation = dev.chungjungsoo.gptmobile.data.agent.tool.GitHubOperationTool.operationName(tool.name)\n            tool.modelVisible && (tool.name == "read_recovery_context" || operation == "github_context")\n        }.mapTo(linkedSetOf()) { it.name }',
              '        // The upstream-selected subset is not the full executable inventory.\n        // Preserve its GitHub contracts, including opaque authorized MCP aliases.\n        return tools.filter { tool ->\n            tool.modelVisible && (tool.name == "read_recovery_context" || ProgressiveToolCatalog.isGitHubTool(tool))\n        }.mapTo(linkedSetOf()) { it.name }')
          replace(main + 'data/agent/provider/LiteRtLmAdapter.kt',
              '        // Ordinary sessions honor an upstream inventory. Explicit GitHub mode\n        // restores every authorized visible GitHub schema before local admission;\n        // capacity may reject that inventory but cannot silently narrow it.',
              '        // Authorization and advertised schemas are distinct. Honor the upstream\n        // subset in every mode; preserve its selected GitHub contracts and reject\n        // a subset that cannot fit the local engine context.')
          replace(test + 'data/context/LocalContextPlannerTest.kt',
              '        assertTrue(LocalContextPlanner.requiredToolNames("Hi", definitions, githubMode = true).isEmpty())',
              '        val admitted = definitions.filter { it.name in selected }\n        assertEquals(setOf(github.first().name), LocalContextPlanner.requiredToolNames("Hi", admitted, githubMode = true))')
          replace(test + 'data/context/LocalContextPlannerTest.kt',
              '            val plan = LocalContextPlanner.plan(emptyList(), "Hi", "", oversized, 4096, 1024, renderToolPrompt = renderer, githubMode = true)',
              '            val selected = LocalContextPlanner.advertisedToolNames(oversized, emptyList(), githubMode = true)\n            val plan = LocalContextPlanner.plan(emptyList(), "Hi", "", oversized.filter { it.name in selected }, 4096, 1024, renderToolPrompt = renderer, githubMode = true)')
          replace(test + 'data/agent/GitHubFullToolVisibilityTest.kt',
              'AgentRunner(AgentRunLimits(githubMode = true, maxRounds = 3)).run(session, listOf(github), selectDefinitions = { emptyList() })',
              'AgentRunner(AgentRunLimits(githubMode = true, maxRounds = 3)).run(session, listOf(github))')
          output = Path(os.environ['RUNNER_TEMP']) / 'context-repair'
          output.mkdir()
          (output / 'paths.json').write_text(json.dumps(sorted(touched)))
          PY
      - name: Format changed Kotlin and regenerate inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/ktlint" | sha256sum --check
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads((Path(os.environ['RUNNER_TEMP']) / 'context-repair/paths.json').read_text())
          tool = ['java', '-jar', str(Path(os.environ['RUNNER_TEMP']) / 'ktlint')]
          subprocess.run(tool + ['--format'] + paths, check=True)
          subprocess.run(tool + paths, check=True)
          subprocess.run(['python3', 'scripts/generate_app_audit_inventory.py'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Prepare content-addressed tree without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'tailscale-signin/GPT_Mobile_AI-improved'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          output = Path(os.environ['RUNNER_TEMP']) / 'context-repair'
          paths = set(json.loads((output / 'paths.json').read_text()))
          paths.update(['app/src/main/assets/diagnostics/app-code-inventory.json', 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/audit/AppAuditSourceInventory.kt'])
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == paths, (changed - paths, paths - changed)
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          pr = api('/pulls/1122')
          assert pr['state'] == 'open' and pr['head']['sha'] == head
          assert pr['head']['ref'] == 'fix/github-context-and-voice-reliability-2026-11-14'
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': Path(p).read_text()} for p in sorted(paths)]
          entries.append({'path': '.github/workflows/pr1122-context-qualification.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': api('/git/commits/' + head)['tree']['sha'], 'tree': entries})
          receipt = {'source_head': head, 'tree_sha': tree['sha'], 'files': sorted(paths), 'formatting': 'passed', 'inventory': 'regenerated', 'ref_updated': False}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (output / 'prepared.patch').write_bytes(subprocess.check_output(['git', 'diff', '--full-index']))
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1122-context-prepared
          path: ${{ runner.temp }}/context-repair
          retention-days: 1
          if-no-files-found: error
