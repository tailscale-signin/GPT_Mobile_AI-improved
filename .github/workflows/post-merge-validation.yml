name: Post-merge correctness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    name: Post-merge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install repository contract dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/check_android_resources.py
      - run: python3 scripts/check_android_regex.py
      - run: python3 scripts/check_room_schemas.py
      - run: python3 scripts/check_qnn_provenance.py
