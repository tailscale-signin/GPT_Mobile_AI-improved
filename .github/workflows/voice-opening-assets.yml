name: Generate voice acknowledgement bank

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/voice-opening-assets.yml'
      - 'scripts/render_voice_opening_bank.py'
      - 'app/src/main/assets/voice-opening-lines.json'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/voice/SpeechLanguages.kt'

permissions:
  contents: read

jobs:
  render:
    name: Render pinned multilingual Kokoro voices
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned speech runtime and audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libgles2 libegl1 libgl1 libglib2.0-0t64 libportaudio2
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-voice-mediapipe-smoke.txt
      - name: Render the bundled voices
        run: python scripts/render_voice_opening_bank.py --model-dir "$RUNNER_TEMP/voice-model" --output "$RUNNER_TEMP/voice-bank/voice-openings.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-openings-${{ github.sha }}
          path: ${{ runner.temp }}/voice-bank/voice-openings.zip
          if-no-files-found: error
          retention-days: 14
