name: Health Connect implementation validation
on:
  push:
    branches: [feat/smartwatch-health-connect-2026-10-11]
    paths: [.github/workflows/health-connect-build.yml]
permissions:
  contents: write
concurrency:
  group: health-connect-implementation
  cancel-in-progress: false
env:
  OBX_DISABLE_ANALYTICS: "true"
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply SDK assertion and query-boundary repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/smartwatch-health-connect-2026-10-11"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          marker=pathlib.Path('app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/health/HealthQueryTest.kt')
          if 'thirtyCalendarDaysAcrossFallBackAreClippedToTheHistoryLimit' not in marker.read_text():
              packed=base64.b64decode(pathlib.Path('.health-connect-transport/repair.b64').read_text(), validate=True)
              assert hashlib.sha256(packed).hexdigest() == '6c92a9795a7555ec1c5f20ae6766e1799c9b1d30bcf670699f6156984615d462'
              patch=lzma.decompress(packed)
              subprocess.run(['git','apply','--check'],input=patch,check=True)
              subprocess.run(['git','apply','--index'],input=patch,check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'fix(health): validate public SDK requests and harden DST, timeout and accessibility behavior'
            git push origin HEAD:feat/smartwatch-health-connect-2026-10-11
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Format changed Kotlin source
        shell: bash
        run: |
          set -euo pipefail
          base=https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.3.1/ktlint-cli-1.3.1-all.jar
          curl --fail --location "$base" -o "$RUNNER_TEMP/ktlint.jar"
          curl --fail --location "$base.sha256" -o "$RUNNER_TEMP/ktlint.sha256"
          echo "$(cat "$RUNNER_TEMP/ktlint.sha256")  $RUNNER_TEMP/ktlint.jar" | sha256sum -c -
          git diff --name-only 28bf17f3b09f92fde169c3149f9a7974bd0148d7 HEAD -- '*.kt' '*.kts' > "$RUNNER_TEMP/health-kotlin-files.txt"
          mapfile -t files < "$RUNNER_TEMP/health-kotlin-files.txt"
          java -jar "$RUNNER_TEMP/ktlint.jar" --format "${files[@]}" 2>&1 | tee health-format.log
          if ! git diff --quiet -- '*.kt' '*.kts'; then
            git add -- '*.kt' '*.kts'
            git commit -m 'style(health): format final regression and accessibility fixes'
            git push origin HEAD:feat/smartwatch-health-connect-2026-10-11
          fi
      - name: Strict compilation and unit tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee health-tests.log
      - name: Android lint and review APK
        id: apk
        if: always() && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:assembleDebug --no-daemon 2>&1 | tee health-build.log
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
      - name: Snapshot resulting branch source
        if: always()
        run: git archive --format=tar HEAD -o health-source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: health-connect-validation
          path: |
            health-*.log
            health-source.tar
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            gradle/verification-metadata.xml
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: health-connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
