name: Prepare verification index correction
on:
  push:
    branches: [fix/github-verification-recovery-2026-11-06]
    paths: ['.github/workflows/verification-index-repair.yml']
permissions:
  contents: write
concurrency:
  group: verification-index-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Regenerate and validate the final-tree index
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/verification-index-repair.yml
          python3 scripts/generate_architecture_index.py
          python3 scripts/generate_architecture_index.py --check
          echo '0170cd9393518755204839fbc38ac288cbc16fbe9e5a905a458e75563fb7fb0a  docs/architecture/repository-index.json' | sha256sum --check
          git add -- docs/architecture/repository-index.json
          git diff --cached --check
          python3 scripts/check_ci_policy.py
          python3 scripts/check_unified_reliability_v2.py
          python3 scripts/check_android_regex.py
          python3 scripts/check_dependency_catalog.py
          python3 -m unittest discover -s scripts/tests
          python3 scripts/test_gguf_prefill_governor.py
          bash scripts/validate.sh resources
          python3 scripts/check_change_size.py --base 223b7c9f1dbf1ecaa77b65936ca112817cfb6a9b
          python3 scripts/scan_secrets.py
      - name: Create exact commit objects without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          parent = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert parent == os.environ['GITHUB_SHA']
          local_tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          def post(endpoint, body):
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + endpoint, data=json.dumps(body).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          entries = [
              {'path':'docs/architecture/repository-index.json','mode':'100644','type':'blob','content':pathlib.Path('docs/architecture/repository-index.json').read_text()},
              {'path':'.github/workflows/verification-index-repair.yml','mode':'100644','type':'blob','sha':None},
          ]
          tree = post('/git/trees', {'base_tree':base_tree,'tree':entries})['sha']
          assert tree == local_tree
          commit = post('/git/commits', {'message':'Remove stale temporary-workflow entry from the generated architecture index','tree':tree,'parents':[parent]})['sha']
          pathlib.Path('prepared-index.json').write_text(json.dumps({'parent':parent,'commit':commit,'tree':tree,'repository_contracts':'passed'},indent=2))
          print('Prepared',commit,'without moving any branch')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-verification-index
          path: prepared-index.json
          retention-days: 1
          if-no-files-found: error
