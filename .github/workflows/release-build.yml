name: Generate Release Version

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Unsigned Release APK & AAB
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: Setup Signing Keystore
        id: setup-keystore
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p keystore_dir
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using repository secret configured release keystore..."
            echo "$KEYSTORE_B64" | base64 -d > keystore_dir/release.keystore
            echo "ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          elif [ -f ".signing/release.jks" ]; then
            echo "Using repository committed release keystore (.signing/release.jks)..."
            cp .signing/release.jks keystore_dir/release.keystore
            echo "ALIAS=gptmobile" >> $GITHUB_ENV
            echo "PASSWORD=gptmobile_release_key" >> $GITHUB_ENV
          else
            echo "Keystore not found. Generating ephemeral release keystore..."
            keytool -genkey -v -keystore keystore_dir/release.keystore -alias gptmobile -keyalg RSA -keysize 2048 -validity 10000 -storepass gptmobile_password -keypass gptmobile_password -dname "CN=GPTMobile, OU=Release, O=OpenSource, L=Seoul, S=Seoul, C=KR"
            echo "ALIAS=gptmobile" >> $GITHUB_ENV
            echo "PASSWORD=gptmobile_password" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$(pwd)/keystore_dir/release.keystore" >> $GITHUB_ENV

      - name: Sign Release APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks "$KEYSTORE_PATH" --alignment-preserved true --ks-pass "env:PASSWORD" --ks-key-alias "$ALIAS" --key-pass "env:PASSWORD" --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk || \
          apksigner sign --ks "$KEYSTORE_PATH" --alignment-preserved true --ks-pass "env:PASSWORD" --ks-key-alias "$ALIAS" --key-pass "env:PASSWORD" --out app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign Release App Bundle
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE_PATH" -storepass "$PASSWORD" -keypass "$PASSWORD" app/build/outputs/bundle/release/app-release.aab "$ALIAS"

      - name: Create Job Summary
        run: |
          unsigned_hash=$(md5sum ./apk/release/app-release-unsigned.apk 2>/dev/null | cut -d' ' -f1 || echo "N/A")
          signed_hash=$(md5sum ./apk/release/app-release.apk 2>/dev/null | cut -d' ' -f1 || echo "N/A")
          signed_aab_hash=$(md5sum ./bundle/release/app-release.aab 2>/dev/null | cut -d' ' -f1 || echo "N/A")
          cert_out=$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs ./apk/release/app-release.apk 2>/dev/null || apksigner verify --print-certs ./apk/release/app-release.apk 2>/dev/null || true)
          certificate_hash=$(echo "$cert_out" | grep "SHA-256" | head -n 1 | awk -F': ' '{print $2}' || echo "N/A")
          echo "### Release Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Unsigned APK md5**: \`$unsigned_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed APK md5**: \`$signed_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed AAB md5**: \`$signed_aab_hash\`" >> $GITHUB_STEP_SUMMARY
          echo "**Certificate SHA-256**: \`$certificate_hash\`" >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ github.workspace }}/app/build/outputs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-release-${{ github.sha }}
          path: |
            ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk
            ${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab

      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
            echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
            echo "release_name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release via gh CLI
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release-tag.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.release-tag.outputs.release_name }}
        run: |
          echo "Creating or uploading release for $TAG_NAME ($RELEASE_NAME)..."
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading release assets..."
            gh release upload "$TAG_NAME" \
              "${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk#app-release.apk" \
              "${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab#app-release.aab" \
              --clobber
          else
            echo "Creating new release $TAG_NAME with assets..."
            gh release create "$TAG_NAME" \
              "${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk#app-release.apk" \
              "${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab#app-release.aab" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_NAME" \
              --generate-notes \
              --latest
          fi

      - name: Check Release Publish Status
        if: steps.publish-release.outcome != 'success'
        run: |
          echo "::warning ::GitHub Release publication step encountered an issue (likely fork GITHUB_TOKEN read-only permission in repo Settings > Actions > General > Workflow permissions). The release binaries were successfully built, signed, and uploaded to GitHub Actions artifacts."
