name: Development environments
on:
  pull_request:
    paths:
      - 'gateway/desktop/development_profiles.py'
      - 'gateway/v14/workspace_environment.py'
      - 'gateway/tests/prepared_environment_smoke.py'
      - '.github/workflows/development-environments.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/desktop/development_profiles.py'
      - 'gateway/v14/workspace_environment.py'
      - 'gateway/tests/prepared_environment_smoke.py'
      - '.github/workflows/development-environments.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-environments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    name: Offline development profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        profile: [python, node, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - name: Prepare image and execute offline
        run: python gateway/tests/prepared_environment_smoke.py ${{ matrix.profile }} build/reports/environment.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-${{ matrix.profile }}-${{ github.sha }}
          path: build/reports/environment.json
          if-no-files-found: warn
          retention-days: 14
