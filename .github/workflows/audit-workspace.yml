name: Diagnostic audit finalization

on:
  push:
    branches: [fix/diagnostic-audit-reliability-2026-10-11]
    paths: [.github/workflows/audit-workspace.yml]

permissions:
  contents: read

env:
  OBX_DISABLE_ANALYTICS: 'true'

jobs:
  finalize:
    if: github.ref == 'refs/heads/fix/diagnostic-audit-reliability-2026-10-11'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and apply final render patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.audit/final-render.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6a6a296bbf9efb459b1a1d5e15fe8a527a63d7bef6fda9f48641a3d11dd6fbf6', 'Patch integrity check failed'
          target = pathlib.Path('/tmp/final-render.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Format and verify changed Kotlin source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z 63bfbebde4c1ce1b74890a91c20517ae2dd4cc19 -- 'app/src/**/*.kt')
          java -jar "$RUNNER_TEMP/ktlint" --format "${files[@]}"
          java -jar "$RUNNER_TEMP/ktlint" "${files[@]}"
      - name: Remove one-time staging and install read-only validation
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          expected = {f'.audit/phase1-{i}.b64' for i in (1,2,3)} | {f'.audit/phase2-{i}.b64' for i in (1,2,3,4)} | {'.audit/final-render.b64', '.audit/retained-workflow.yml'}
          tracked = set(subprocess.check_output(['git', 'ls-files', '.audit']).decode().splitlines())
          assert tracked == expected, 'Unexpected staging files: do not delete unrelated work'
          workflow = pathlib.Path('.audit/retained-workflow.yml').read_text()
          assert 'contents: read' in workflow and 'contents: write' not in workflow
          pathlib.Path('.github/workflows/audit-workspace.yml').write_text(workflow)
          subprocess.run(['git', 'rm', '--', *sorted(expected)], check=True)
          PY
      - name: Commit final source only to the requested branch
        id: commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/diagnostic-audit-reliability-2026-10-11
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git add -- app/src .github/workflows/audit-workspace.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize asynchronous rendering and remove one-time audit staging'
          git push origin "HEAD:refs/heads/$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Package final changed source for review
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMR', '63bfbebde4c1ce1b74890a91c20517ae2dd4cc19', '--', 'app/src']).decode().splitlines()
          with zipfile.ZipFile('audit-formatted.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and p.suffix in {'.kt', '.xml'}:
                      z.write(p, name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-final-source
          path: audit-formatted.zip
          retention-days: 2

  android:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.finalize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Android unit tests, lint and debug compilation
        shell: bash
        run: |
          set -o pipefail
          echo "Tested source: $(git rev-parse HEAD)" | tee audit-android.log
          chmod +x gradlew
          ./gradlew --no-daemon --continue --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug 2>&1 | tee -a audit-android.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-android-results
          path: |
            audit-android.log
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: diagnostic-audit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  preflight:
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.finalize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resource and patch validation
        run: |
          git diff --check 63bfbebde4c1ce1b74890a91c20517ae2dd4cc19 HEAD
          bash scripts/validate.sh resources
