name: GenieX preview validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/geniex/**'
      - 'app/src/litertOnly/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localmodel/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'scripts/check_local_runtime_apk.py'
      - 'docs/audits/geniex-preview-native-libraries.json'
      - '.github/workflows/geniex-preview.yml'

permissions:
  contents: read

concurrency:
  group: geniex-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"

jobs:
  preview:
    runs-on: ubuntu-latest
    # Four independently bounded 25-minute stages, plus setup and artifact audits.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Install Vulkan shader headers for Android GGUF backend
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev spirv-headers
      - name: Run isolated preview unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          ./gradlew -PgeniexRuntime=true :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee build/geniex-validation/unit.log
      - name: Save GenieX unit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geniex-unit-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Build isolated preview APK
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          ./gradlew -PgeniexRuntime=true :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build/geniex-validation/debug.log
      - name: Validate release shrinker for the GenieX runtime
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          # Match native-memory-smoke.yml: release compiler/KSP/R8 analysis
          # memory before ApkFlinger allocates its packaging buffers.
          ./gradlew -PgeniexRuntime=true -PnativeMemorySmoke=true :app:minifyNativeSmokeWithR8 --no-daemon --max-workers=1 --console=plain --info --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/shrinker.log
      - name: Package the minified GenieX APK in a fresh process
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          ./gradlew -PgeniexRuntime=true -PnativeMemorySmoke=true :app:assembleNativeSmoke --no-daemon --max-workers=1 --console=plain --info --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/package.log
      - name: Audit minified GenieX native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/nativeSmoke/*.apk
      - name: Audit resolved Maven AAR
        run: python3 scripts/audit_geniex_aar.py --output app/build/reports/geniex-maven-artifact.json
      - name: Audit packaged native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
      - name: Save GenieX validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geniex-validation-diagnostics
          path: |
            build/geniex-validation/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geniex-preview-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/nativeSmoke/*.apk
            app/build/reports/geniex-maven-artifact.json
          if-no-files-found: error
