name: Android device validation
on:
  workflow_dispatch:
    inputs:
      qnn_model_path:
        description: 'Optional app-readable SM8750 AOT .litertlm path for real NPU qualification'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: android-device-validation
  cancel-in-progress: false
jobs:
  device:
    # Trusted, dedicated device runner: never execute fork pull requests here.
    runs-on: [self-hosted, android-device]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record device identity
        run: |
          adb get-state
          mkdir -p device-evidence
          adb shell getprop > device-evidence/getprop.txt
          adb shell dumpsys thermalservice > device-evidence/thermal-before.txt
      - name: Instrumented behavior and native memory checks
        run: ./gradlew :app:connectedDebugAndroidTest
      - name: Qualify SM8750 NPU inference without fallback
        if: inputs.qnn_model_path != ''
        env:
          QNN_MODEL_PATH: ${{ inputs.qnn_model_path }}
        run: |
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=dev.chungjungsoo.gptmobile.data.localruntime.QualcommNpuInstrumentedTest \
            "-Pandroid.testInstrumentationRunnerArguments.qnnModelPath=$QNN_MODEL_PATH"
      - name: Collect visual review fixtures
        if: always()
        run: |
          adb exec-out run-as dev.melo.gptmobile.improved tar -cf - files/ui-review > device-evidence/ui-review.tar
      - name: Capture Qualcomm execution logs
        if: always()
        run: adb logcat -d -v threadtime -s QnnQualification LiteRT QnnHtp > device-evidence/qnn-logcat.txt
      - name: Generate Baseline Profile and measure performance
        run: ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest
      - name: Device evidence
        if: always()
        run: |
          adb shell dumpsys thermalservice > device-evidence/thermal-after.txt
          adb shell dumpsys meminfo dev.melo.gptmobile.improved > device-evidence/memory.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: physical-device-evidence
          path: |
            device-evidence/
            app/build/reports/androidTests/
            macrobenchmark/build/outputs/
