name: PR Validation

env:
  OBX_DISABLE_ANALYTICS: "true"

on:
  pull_request:
    # Changing draft status or retargeting a PR must re-run the completion gate.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reliability_v2_completion:
    name: Unified Reliability v2 completion gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce v2 completion independently of draft status
        env:
          # Keep branch names in data and support PR, merge queue, push and manual runs.
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || github.ref_name }}
        run: python3 scripts/check_unified_reliability_pr.py --head-ref "$HEAD_REF"

  validate:
    name: Unit tests, heap checks and review APK
    runs-on: ubuntu-latest
    # Leave time for diagnostics after the individually bounded validation steps.
    timeout-minutes: 125

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle Problem Matcher
        run: echo "::add-matcher::.github/gradle-problem-matcher.json"
        continue-on-error: true

      # Cold compilation consumed about 15 minutes of the old 25-minute test
      # deadline. Bound compilation separately so the complete suite can finish.
      - name: Compile unit tests in a separate process
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac --no-daemon --console=plain 2>&1 | tee unit-compile.log

      - name: Run Unit Tests & JaCoCo Coverage Report
        id: unit_tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_metrics.py --label unit-tests --output build/reports/profile/unit-metrics.json -- python3 scripts/gradle_retry.py -- :app:testDebugUnitTest :app:jacocoTestReport --no-daemon --info 2>&1 | tee test.log || (echo "=== TEST FAILURE LOG ===" && tail -n 100 test.log && exit 1)
          python3 scripts/check_jacoco_coverage.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload generated statistics schema and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 14
          name: statistics-schema-and-tests
          path: |
            app/schemas/dev.chungjungsoo.gptmobile.data.telemetry.tool.ToolStatisticsDatabase/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.database.ChatDatabaseV2/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.research.feature.ResearchDatabase/*.json
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/unified-runtime-paired.json
          if-no-files-found: warn

      - name: Verify exported Room schemas
        if: always()
        run: python3 scripts/check_room_schemas.py

      - name: Verify recovery and exports with a 256 MiB Java heap
        id: heap_recovery
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- -I scripts/heap-stress.init.gradle :app:testDebugUnitTest --no-daemon \
            --tests '*ResearchSessionStoreHeapTest' --tests '*StreamingDebugBundleTest' \
            --tests '*BenchmarkStreamingExportHeapTest' \
            --tests '*BenchmarkColdStreamingExportHeapTest' 2>&1 | tee heap.log

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: "app/build/test-results/testDebugUnitTest/*.xml"
          annotate_only: true
          check_name: "Unit Test Results"
          fail_on_failure: true
          require_tests: true
          check_annotations: false
          check_retries: false
          fail_on_parse_error: true

      - name: Build review APK and verify packaged runtime
        id: review_apk
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/build_metrics.py --label review-apk --output build/reports/profile/review-metrics.json -- python3 scripts/gradle_retry.py -- :app:assembleDebug --no-daemon 2>&1 | tee apk.log
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            python3 scripts/check_research_dispatch_size.py "$apk"
          done

      - name: Upload review APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 14
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

      - name: Upload dependency verification failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-verification
          path: '**/build/reports/dependency-verification/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect structured failure diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py unit-compile.log test.log lint.log heap.log apk.log

      - name: Upload validation logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-validation-logs
          path: |
            ci-diagnostics.json
            unit-compile.log
            test.log
            heap.log
            lint.log
            apk.log
            app/build/test-results/heapRecovery/*.xml
            app/build/reports/reliability-ui/*.png
            build/reports/profile/*-metrics.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate PR Step Summary
        if: always()
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          HEAP_RECOVERY_OUTCOME: ${{ steps.heap_recovery.outcome }}
          REVIEW_APK_OUTCOME: ${{ steps.review_apk.outcome }}
        run: |
          {
            echo "## CI Validation Summary"
            echo
            echo "| Validation | Result |"
            echo "| --- | --- |"
            printf '| Unit tests and coverage | %s |\n' "${UNIT_TEST_OUTCOME:-not run}"
            printf '| 256 MiB recovery and export gate | %s |\n' "${HEAP_RECOVERY_OUTCOME:-not run}"
            printf '| APK build and runtime verification | %s |\n' "${REVIEW_APK_OUTCOME:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  android_lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-android

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers

      - name: Run Android Lint
        id: android_lint
        # The expanded app's cold local lint pass took 19m29s; retain useful headroom.
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- :app:lintDebug --no-daemon --info 2>&1 | tee lint.log || (echo "=== LINT FAILURE LOG ===" && tail -n 100 lint.log && exit 1)

      - name: Retain lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-lint-reports
          path: |
            lint.log
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: Repository and gateway contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Repository contracts and workflow policy
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python3 scripts/check_ci_policy.py
          python3 scripts/generate_architecture_index.py --check
          python3 scripts/check_unified_reliability_v2.py
          python3 scripts/check_android_regex.py
          python3 -m unittest discover -s scripts/tests
          python3 scripts/test_gguf_prefill_governor.py
          bash scripts/validate.sh resources
          python3 scripts/check_change_size.py --base "$CHANGE_BASE"
          python3 scripts/scan_secrets.py
      - name: Review newly introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dependency_review.py --repository "$GITHUB_REPOSITORY" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-review
          path: dependency-review.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Gateway and GitHub OAuth broker contracts
        run: |
          python3 -m pip install --require-hashes -r gateway/requirements.txt
          python3 -m py_compile gateway/gateway*.py
          python3 gateway/check_gateway.py
          python3 -m unittest authentication.test_github_broker authentication.test_app

  format:
    name: Changed Kotlin formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check changed Kotlin sources
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/ktlint" | sha256sum --check
          python3 scripts/check_changed_kotlin.py --base "$CHANGE_BASE" --ktlint "$RUNNER_TEMP/ktlint"

  required_verification:
    name: Required verification
    if: always()
    needs: [reliability_v2_completion, validate, android_lint, contracts, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require every expected job to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_required_verification.py
