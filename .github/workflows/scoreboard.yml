name: Community Scoreboard

on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/scoreboard.yml'
      - 'scripts/scoreboard.py'
      - 'scripts/publish_scoreboard.py'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional submission issue to retry; leave blank to initialize and recover pending submissions'
        required: false
        type: string

permissions: {}

jobs:
  validate-and-publish:
    if: github.repository == 'tailscale-signin/GPT_Mobile_AI-improved' && (github.event_name != 'issues' || startsWith(github.event.issue.title, '[Scoreboard v1] '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      # Only trusted default-branch code executes. No issue text is interpolated into a shell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate data and publish best complete results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_scoreboard.py
