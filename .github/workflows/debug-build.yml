name: Generate Debug Version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - trigger-debug-build

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report build failure as an issue
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          BUILD_LOG: gradle-build.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILD_LOG)
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8')
              : 'Gradle did not produce a build log.';
            const maxLogLength = 45000;
            const excerpt = log.length > maxLogLength
              ? `[Earlier output omitted; full log is attached to the workflow run.]\n${log.slice(-maxLogLength)}`
              : log;
            const source = context.payload.pull_request
              ? `PR #${context.payload.pull_request.number}`
              : `ref \`${context.ref}\``;
            const title = `Build failure: ${source}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The debug APK build failed.',
              '',
              `- Source: ${source}`,
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${runUrl}`,
              '- Full log: download the `gradle-build-log` artifact from the workflow run.',
              '',
              '<details><summary>Gradle error output</summary>',
              '',
              '```text',
              excerpt,
              '```',
              '</details>'
            ].join('\n');

            const { data: matches } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title \"${title}\"`,
              per_page: 10
            });
            const existing = matches.items.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body
              });
            }

      - name: Fail workflow after reporting
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload Debug APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
