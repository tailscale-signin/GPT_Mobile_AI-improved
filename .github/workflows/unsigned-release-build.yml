name: Build Unsigned Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    name: Build Release APKs and AAB (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free runner disk and memory space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Configure swap space for CI stability
        run: |
          echo "Setting up 4GB swap space to prevent runner OOM during release minification and dexing..."
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Require qualified QNN dispatch provenance
        run: python3 scripts/check_qnn_provenance.py

      - name: Shrink release code in a separate process
        run: |
          # Release the compiler/R8 analysis heap before packaging all ABI splits.
          ./gradlew :app:minifyReleaseWithR8 --no-daemon --max-workers=1 --console=plain --stacktrace -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8'

      - name: Build optimized release APKs
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=1 --console=plain --stacktrace -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8'
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/release/*-unsigned.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/release/*-unsigned.apk
          python3 scripts/check_apk_size.py app/build/outputs/apk/release --build-type release --report release-apk-size-report.json
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*-unsigned.apk release-assets/

      - name: Build optimized release bundle
        run: |
          rm -rf app/build/intermediates/shrunk_resources_proto_format/release/minifyReleaseWithR8
          ./gradlew :app:bundleRelease -PenableAbiSplits=false --no-daemon --max-workers=1 --console=plain --stacktrace -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8'
          python3 scripts/check_mediapipe_jni.py app/build/outputs/bundle/release/*.aab
          python3 scripts/check_objectbox_jni.py app/build/outputs/bundle/release/*.aab
          python3 scripts/check_play_bundle.py app/build/outputs/bundle/release/*.aab
          cp app/build/outputs/bundle/release/app-release.aab release-assets/app-release-unsigned.aab
          cd release-assets
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Save release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

      - name: Save R8 diagnostics for release failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-r8-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Save release APK size diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-apk-size-${{ github.sha }}
          path: release-apk-size-report.json
          if-no-files-found: ignore
