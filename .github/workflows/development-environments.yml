name: Development environments
on:
  pull_request:
    paths:
      - 'gateway/desktop/development_profiles.py'
      - 'gateway/v14/workspace_environment.py'
      - 'gateway/tests/prepared_environment_smoke.py'
      - '.github/workflows/development-environments.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/desktop/development_profiles.py'
      - 'gateway/v14/workspace_environment.py'
      - 'gateway/tests/prepared_environment_smoke.py'
      - '.github/workflows/development-environments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe:
    name: Identify development environment recipe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.recipe.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: recipe
        env:
          RECIPE_DIGEST: ${{ hashFiles('.github/workflows/development-environments.yml', 'gateway/desktop/development_profiles.py', 'gateway/desktop/repository_validation.py', 'gateway/v14/engineering_validation.py', 'gateway/v14/workspace_environment.py', 'gateway/tests/prepared_environment_smoke.py', 'gateway/requirements.txt') }}
        run: |
          [[ "$RECIPE_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          echo "digest=$RECIPE_DIGEST" >> "$GITHUB_OUTPUT"
  prepare:
    needs: recipe
    concurrency:
      # Finish each distinct preparation recipe, retaining only its newest waiting candidate.
      group: development-environments-${{ github.event.pull_request.number || github.ref }}-${{ matrix.profile }}-${{ needs.recipe.outputs.digest }}
      cancel-in-progress: false
    name: Offline development profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        profile: [python, node, android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - name: Prepare image and execute offline
        run: python gateway/tests/prepared_environment_smoke.py ${{ matrix.profile }} build/reports/environment.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/reports/environment.json
            build/reports/outputs/
          if-no-files-found: warn
          retention-days: 14
