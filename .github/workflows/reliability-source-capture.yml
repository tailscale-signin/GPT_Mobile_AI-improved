name: Reliability source capture

on:
  push:
    branches: [fix/reliability-fault-recovery-2026-11-06]
    paths: ['.github/workflows/reliability-source-capture.yml']

permissions:
  contents: read

concurrency:
  group: reliability-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture tracked UTF-8 source and exact revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > reliability-source-revision.txt
          git ls-tree -r HEAD > reliability-source-tree.txt
          python3 - <<'PY'
          import io, pathlib, subprocess, tarfile
          names = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          with tarfile.open('reliability-source.tar.gz', 'w:gz') as archive:
              for raw in names:
                  if not raw:
                      continue
                  path = pathlib.Path(raw.decode('utf-8'))
                  if path.is_symlink() or not path.is_file():
                      continue
                  data = path.read_bytes()
                  if len(data) > 8 * 1024 * 1024:
                      continue
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  info = tarfile.TarInfo(path.as_posix())
                  info.size = len(data)
                  info.mode = 0o755 if path.stat().st_mode & 0o111 else 0o644
                  archive.addfile(info, io.BytesIO(data))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reliability-source-${{ github.sha }}
          path: |
            reliability-source.tar.gz
            reliability-source-revision.txt
            reliability-source-tree.txt
          retention-days: 1
          if-no-files-found: error
