name: Gateway Windows installer
on:
  pull_request:
    paths: ['gateway/**', '.github/workflows/gateway-windows-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - run: python -m pip install --require-hashes -r gateway/desktop/requirements-build.txt
      - run: python -m unittest discover -s gateway/tests -p test_gateway_desktop.py
      - run: python gateway/desktop/build_windows.py
      - run: python gateway/desktop/smoke_windows.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Gateway-Windows-x64
          path: |
            dist/windows/*-setup.exe
            dist/windows/*.zip
            dist/windows/SHA256SUMS.txt
            dist/windows/smoke-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: Gateway-Windows-diagnostics
          path: dist/windows/*.log
          if-no-files-found: ignore
