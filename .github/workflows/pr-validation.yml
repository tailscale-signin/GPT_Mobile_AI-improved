name: PR Validation

env:
  OBX_DISABLE_ANALYTICS: "true"
  ISSUE_REPORT_ORIGIN: ${{ vars.ISSUE_REPORT_ORIGIN }}
  ISSUE_REPORT_GITHUB_ENABLED: ${{ vars.ISSUE_REPORT_GITHUB_ENABLED || 'true' }}

on:
  pull_request:
    # Changing draft status or retargeting a PR must re-run the completion gate.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reliability_v2_completion:
    name: Unified Reliability v2 scope / strict release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scoped release boundary may precede the PR base by many commits.
          fetch-depth: 0
      - name: Enforce v2 completion independently of draft status
        env:
          # Keep branch names in data and support PR, merge queue, push and manual runs.
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref || github.ref_name }}
        run: python3 scripts/check_unified_reliability_pr.py --head-ref "$HEAD_REF"
      - name: Verify scoped release files and disclosures
        run: python3 scripts/check_release_scope.py --commit "$GITHUB_SHA"

  validate:
    name: Unit tests, heap checks and review APK
    runs-on: ubuntu-latest
    # Leave time for diagnostics after the individually bounded validation steps.
    timeout-minutes: 125

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle Problem Matcher
        run: echo "::add-matcher::.github/gradle-problem-matcher.json"
        continue-on-error: true

      - name: Verify model packaging and portable-domain configuration cache
        timeout-minutes: 10
        run: python3 scripts/check_model_configuration_cache.py

      - name: Provision verified Robolectric runtimes
        timeout-minutes: 10
        run: python3 scripts/provision_robolectric_sdks.py

      # Release KSP/KAPT/compiler graphs between phases. Run 42144027027
      # exhausted the bounded 3 GiB heap when generating and compiling together.
      - name: Generate unit-test production sources
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- :app:kspDebugKotlin :app:kaptDebugKotlin --no-daemon --console=plain --max-workers=1 2>&1 | tee unit-generation.log

      - name: Compile unit-test production sources
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          # Run 42164047298 exhausted 3 GiB even after separate KSP/KAPT.
          # The same revision compiled in CodeQL's bounded 4 GiB process.
          python3 scripts/gradle_retry.py -- :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --console=plain --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee unit-production.log

      - name: Compile unit tests in a separate process
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac --no-daemon --console=plain 2>&1 | tee unit-compile.log

      - name: Run Unit Tests & JaCoCo Coverage Report
        id: unit_tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > app-audit-test-started.txt
          # Qualification needs fresh test/session receipts. Reuse compilation,
          # but do not restore the actual test or coverage reports from cache.
          python3 scripts/build_metrics.py --label unit-tests --output build/reports/profile/unit-metrics.json -- python3 scripts/gradle_retry.py -- :app:testDebugUnitTest --rerun :app:jacocoTestReport --rerun --no-daemon --info 2>&1 | tee test.log || (echo "=== TEST FAILURE LOG ===" && tail -n 100 test.log && exit 1)
          python3 scripts/check_jacoco_coverage.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Collect named audit qualification and measured coverage
        if: always()
        run: >-
          python3 scripts/collect_app_audit_qualification.py
          --started-at-file app-audit-test-started.txt
          --coverage app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          --output app-audit-source-qualification.json

      - name: Reconcile v2 cases against exact named JVM regressions (no status promotion)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          junit_args=()
          if compgen -G 'app/build/test-results/testDebugUnitTest/TEST-*.xml' >/dev/null; then
            junit_args=(--junit-dir app/build/test-results/testDebugUnitTest --qualification app-audit-source-qualification.json --fail-on-candidate-regression)
          fi
          python3 scripts/unified_reliability_v2_reconcile.py \
            "${junit_args[@]}" \
            --source-sha "$(git rev-parse HEAD)" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --output build/reports/unified-reliability-v2/reconciliation.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('build/reports/unified-reliability-v2/reconciliation.json')
          report = json.loads(p.read_text())
          s = report['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Unified Reliability v2 — evidence inventory (not acceptance)\n')
              f.write(f"Recorded: {s['case_outcomes'].get('PASS', 0)}/110 PASS; "
                      f"{s['case_outcomes'].get('NOT_RUN', 0)} NOT_RUN; "
                      f"{s['task_statuses'].get('DONE', 0)}/48 tasks DONE.\n\n")
              f.write(f"{s['not_run_with_partial_component_proof']} outstanding cases have "
                      "named partial-component probes in this run. None have been promoted.\n")
          PY

      - name: Upload generated statistics schema and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 14
          name: statistics-schema-and-tests
          path: |
            app/schemas/dev.chungjungsoo.gptmobile.data.telemetry.tool.ToolStatisticsDatabase/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.database.ChatDatabaseV2/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.research.feature.ResearchDatabase/*.json
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/unified-runtime-paired.json
            build/reports/unified-reliability-v2/reconciliation.json
            app-audit-test-started.txt
            app-audit-source-qualification.json
          if-no-files-found: warn

      - name: Verify exported Room schemas
        if: always()
        run: python3 scripts/check_room_schemas.py

      - name: Verify recovery and exports with constrained Java heaps
        id: heap_recovery
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- -I scripts/heap-stress.init.gradle :app:testDebugUnitTest --no-daemon \
            --tests '*ResearchSessionStoreHeapTest' --tests '*StreamingDebugBundleTest' \
            --tests '*BenchmarkStreamingExportHeapTest' \
            --tests '*BenchmarkColdStreamingExportHeapTest' 2>&1 | tee heap.log
          python3 scripts/gradle_retry.py -- -I scripts/heap-stress.init.gradle :app:testDebugUnitTest --no-daemon \
            -Pgptmobile.diagnosticHeapStress=true --tests '*StagedDiagnosticCaptureHeapTest' 2>&1 | tee -a heap.log

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: "app/build/test-results/testDebugUnitTest/*.xml"
          annotate_only: true
          check_name: "Unit Test Results"
          fail_on_failure: true
          require_tests: true
          check_annotations: false
          check_retries: false
          fail_on_parse_error: true

      - name: Build review APK and verify packaged runtime
        id: review_apk
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          # Audit run 43165575025 exhausted 3 GiB after cold DEX tasks.
          # Match the successful same-tree UI APK memory bounds for cache misses.
          python3 scripts/build_metrics.py --label review-apk --output build/reports/profile/review-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 1140 -- :app:assembleDebug --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee apk.log
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_apk_size.py app/build/outputs/apk/debug --build-type debug --report apk-size-report.json
          for apk in app/build/outputs/apk/debug/*.apk; do
            python3 scripts/check_research_dispatch_size.py "$apk"
          done

      - name: Upload review APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 14
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

      - name: Upload dependency verification failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-verification
          path: '**/build/reports/dependency-verification/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect structured failure diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py unit-generation.log unit-production.log unit-compile.log test.log lint.log heap.log apk.log

      - name: Upload validation logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-validation-logs
          path: |
            ci-diagnostics.json
            unit-generation.log
            unit-production.log
            unit-compile.log
            test.log
            heap.log
            lint.log
            apk.log
            apk-size-report.json
            app/build/test-results/heapRecovery/*.xml
            app/build/test-results/diagnosticHeapRecovery/*.xml
            app/build/reports/reliability-ui/*.png
            build/reports/profile/*-metrics.json
            build/reports/configuration-cache-verification/*.log
            core-domain/build/test-results/jvmTest/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate PR Step Summary
        if: always()
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          HEAP_RECOVERY_OUTCOME: ${{ steps.heap_recovery.outcome }}
          REVIEW_APK_OUTCOME: ${{ steps.review_apk.outcome }}
        run: |
          {
            echo "## CI Validation Summary"
            echo
            echo "| Validation | Result |"
            echo "| --- | --- |"
            printf '| Unit tests and coverage | %s |\n' "${UNIT_TEST_OUTCOME:-not run}"
            printf '| 256 MiB recovery and 64 MiB diagnostic export gates | %s |\n' "${HEAP_RECOVERY_OUTCOME:-not run}"
            printf '| APK build and runtime verification | %s |\n' "${REVIEW_APK_OUTCOME:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  android_lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-android

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh

      # Release KSP/KAPT before cold compilation, and compilation before lint.
      # Only compilation needs the observed 4 GiB bound; lint keeps its defaults.
      - name: Generate production sources before lint in a separate process
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 540 -- :app:kspDebugKotlin :app:kaptDebugKotlin --no-daemon --max-workers=1 --console=plain 2>&1 | tee lint-ksp.log

      - name: Compile production sources before lint in a separate process
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 1140 -- :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --max-workers=1 --console=plain '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee lint-compile.log

      - name: Run Android Lint
        id: android_lint
        # The expanded app's cold local lint pass took 19m29s; retain useful headroom.
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py -- :app:lintDebug --no-daemon --max-workers=1 --info 2>&1 | tee lint.log || (echo "=== LINT FAILURE LOG ===" && tail -n 100 lint.log && exit 1)

      - name: Retain lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-lint-reports
          path: |
            lint-ksp.log
            lint-compile.log
            lint.log
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  contracts:
    name: Repository and gateway contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate workflow syntax
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Repository contracts and workflow policy
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python3 scripts/check_ci_policy.py
          python3 scripts/generate_architecture_index.py --check
          python3 scripts/check_unified_reliability_v2.py
          python3 scripts/check_android_regex.py
          python3 scripts/check_dependency_catalog.py
          python3 -m unittest discover -s scripts/tests
          python3 scripts/test_gguf_prefill_governor.py
          bash scripts/validate.sh resources
          python3 scripts/check_change_size.py --base "$CHANGE_BASE"
          python3 scripts/scan_secrets.py
      - name: Review newly introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dependency_review.py --repository "$GITHUB_REPOSITORY" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-review
          path: dependency-review.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Gateway and GitHub OAuth broker contracts
        if: ${{ !cancelled() }}
        run: |
          python3 -m pip install --require-hashes -r gateway/requirements.txt
          python3 -m py_compile gateway/gateway*.py
          python3 gateway/check_gateway.py
          python3 -m unittest authentication.test_github_broker authentication.test_app authentication.test_ticket_broker

  format:
    name: Changed Kotlin formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check changed Kotlin sources
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          echo "a9f923be58fbd32670a17f0b729b1df804af882fa57402165741cb26e5440ca1  $RUNNER_TEMP/ktlint" | sha256sum --check
          python3 scripts/check_changed_kotlin.py --base "$CHANGE_BASE" --ktlint "$RUNNER_TEMP/ktlint"

  required_verification:
    name: Required verification
    if: always()
    needs: [reliability_v2_completion, validate, android_lint, contracts, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require every expected job to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_required_verification.py
