name: Apply final UI refinements

on:
  push:
    branches: [fix/tool-trace-official-icon-summary]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tool-trace-official-icon-summary
      - name: Apply and commit source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tool = Path("app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/chat/ToolTraceBlock.kt")
          text = tool.read_text()
          text = text.replace(
              "painter = painterResource(id = R.drawable.ic_gpt_mobile_foreground),",
              """painter = painterResource(
                  id = if (info.monogram == GitHubTool.monogram && info.badgeColor == GitHubTool.badgeColor) {
                      R.drawable.ic_github
                  } else {
                      R.drawable.ic_gpt_mobile_foreground
                  },
              ),""",
              1,
          )
          text = text.replace(".padding(start = 16.dp)\n            .fillMaxWidth()", ".padding(horizontal = 16.dp)\n            .fillMaxWidth()", 1)
          text = text.replace(".background(MaterialTheme.colorScheme.surfaceVariant)\n            .semantics { contentDescription = traceBlockDescription },", ".background(Color.Black.copy(alpha = 0.18f))\n            .semantics { contentDescription = traceBlockDescription },", 1)
          text = text.replace(".padding(12.dp),\n            verticalAlignment = Alignment.CenterVertically,\n        ) {\n            ToolServiceCircleIcon(primaryServiceInfo)", ".padding(horizontal = 12.dp, vertical = 8.dp),\n            verticalAlignment = Alignment.CenterVertically,\n        ) {\n            ToolServiceCircleIcon(primaryServiceInfo)", 1)
          tool.write_text(text)

          home = Path("app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/home/HomeScreen.kt")
          text = home.read_text()
          if "import androidx.compose.foundation.background\n" not in text:
              text = text.replace("import androidx.compose.foundation.ExperimentalFoundationApi\n", "import androidx.compose.foundation.ExperimentalFoundationApi\nimport androidx.compose.foundation.background\n", 1)
          if "import androidx.compose.ui.draw.clip\n" not in text:
              text = text.replace("import androidx.compose.ui.Alignment\n", "import androidx.compose.ui.Alignment\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Brush\n", 1)
          old = """    Card(
        modifier = Modifier
            .fillMaxWidth()
            .padding(horizontal = 16.dp, vertical = 6.dp)
            .combinedClickable(onClick = onClick),
        shape = RoundedCornerShape(12.dp),
        colors = CardDefaults.cardColors(
            containerColor = MaterialTheme.colorScheme.surfaceVariant
        )
    ) {
        Column(
            modifier = Modifier
                .fillMaxWidth()
                .padding(16.dp)
        ) {"""
          new = """    val shape = RoundedCornerShape(12.dp)
    val topColor = MaterialTheme.colorScheme.surfaceContainerHigh
    val bottomColor = MaterialTheme.colorScheme.surfaceContainerHighest
    Card(
        modifier = Modifier
            .fillMaxWidth()
            .padding(horizontal = 12.dp, vertical = 6.dp)
            .heightIn(min = 120.dp)
            .clip(shape)
            .background(Brush.verticalGradient(listOf(topColor, bottomColor)))
            .combinedClickable(onClick = onClick),
        shape = shape,
        colors = CardDefaults.cardColors(containerColor = Color.Transparent)
    ) {
        Column(
            modifier = Modifier
                .fillMaxWidth()
                .padding(horizontal = 20.dp, vertical = 18.dp)
        ) {"""
          text = text.replace(old, new, 1)
          home.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-final-ui.yml
          git add app/src/main
          git diff --cached --quiet && exit 1
          git commit -m 'Refine tool and favorite bubbles'
          git push origin HEAD:fix/tool-trace-official-icon-summary
