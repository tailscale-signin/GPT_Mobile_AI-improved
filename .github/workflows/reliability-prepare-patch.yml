name: Prepare reliability repair

on:
  push:
    branches: [fix/reliability-fault-recovery-2026-11-06]
    paths: ['.github/workflows/reliability-prepare-patch.yml']

permissions:
  contents: write

concurrency:
  group: reliability-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply exact-source reviewed changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          base = '060486b49b5dad654b8868ea1325c276349be688'
          preparer = '.github/workflows/reliability-prepare-patch.yml'
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines()
          assert changed == [preparer], changed
          root = pathlib.Path.cwd()
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def blob(sha):
              request = urllib.request.Request(api+'/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  result = json.load(response)
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              return data.decode('utf-8')
          operations = []
          for sha in ['ed6756e502368b1eba782c31efa6c455885a64ae','8061a6d78ecedd0299adbf4709fc17f9e1b8acc1','9119d36becd762087e4f87846861873fdc6b5bc8']:
              operations.extend(json.loads(blob(sha))['operations'])
          for path, sha in [('gateway/tests/test_gateway_reliability_faults.py','2f80063cd1b7d8d20cf2cf41bfe9f9181cafb501'),('docs/repairs/reliability-fault-recovery-2026-11-06.md','2b7da286aa931f50e17f97ce91698a02cb2cee9a')]:
              value = blob(sha)
              operations.append({'path':path,'create':value,'before':None,'after':hashlib.sha256(value.encode()).hexdigest()})
          seen = set()
          for op in operations:
              path = pathlib.Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and op['path'] not in seen
              seen.add(op['path'])
              before = path.read_text() if path.exists() else None
              actual = hashlib.sha256(before.encode()).hexdigest() if before is not None else None
              assert actual == op['before'], (str(path),'before',actual,op['before'])
              if op.get('delete'):
                  path.unlink()
                  continue
              value = op.get('create',before)
              for start,end,replacement in reversed(op.get('edits',[])):
                  assert 0 <= start <= end <= len(value)
                  value = value[:start]+replacement+value[end:]
              actual = hashlib.sha256(value.encode()).hexdigest()
              assert actual == op['after'], (str(path),'after',actual,op['after'])
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(value)
          pathlib.Path(preparer).unlink()
          subprocess.run(['git','add','-A'],check=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'reliability-paths.json').write_text(json.dumps(sorted(seen|{preparer})))
          PY
      - name: Format and validate changed Kotlin
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          mapfile -d '' files < <(git diff --cached --name-only --diff-filter=ACMR -z -- 'app/src/**/*.kt')
          if ((${#files[@]})); then
            java -jar "$RUNNER_TEMP/ktlint" --format "${files[@]}"
            java -jar "$RUNNER_TEMP/ktlint" "${files[@]}"
          fi
          git add -A
          git diff --cached --check
          python3 scripts/generate_architecture_index.py --check
      - name: Prepare implementation and manifest commits without updating a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def post(path,payload):
              request=urllib.request.Request(api+path,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          head=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          paths=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'reliability-paths.json').read_text())
          entries=[]
          for name in paths:
              path=pathlib.Path(name)
              entry={'path':name,'mode':'100644','type':'blob'}
              if path.exists():
                  entry['content']=path.read_text()
              else:
                  entry['sha']=None
              entries.append(entry)
          tree=post('/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
          implementation=post('/git/commits',{'message':'Repair bounded retry, batch recovery, catalog evidence and replay integrity','tree':tree,'parents':[head]})['sha']
          manifest_path=pathlib.Path('gateway/manifest-v14.json')
          manifest=json.loads(manifest_path.read_text())
          for name,digest in manifest['files'].items():
              assert hashlib.sha256((pathlib.Path('gateway')/name).read_bytes()).hexdigest()==digest, name
          manifest['sourceCommit']=implementation
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          final_tree=post('/git/trees',{'base_tree':tree,'tree':[{'path':str(manifest_path),'mode':'100644','type':'blob','content':manifest_path.read_text()}]})['sha']
          candidate=post('/git/commits',{'message':'Bind reliability gateway payload to reviewed implementation','tree':final_tree,'parents':[implementation]})['sha']
          output=pathlib.Path('prepared-reliability'); output.mkdir()
          receipt={'parent':head,'implementation':implementation,'candidate':candidate,'tree':final_tree,'paths':paths,'file_sha256':{name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() if pathlib.Path(name).exists() else None for name in paths}}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with tarfile.open(output/'changed-source.tar.gz','w:gz') as archive:
              for name in paths:
                  if pathlib.Path(name).exists(): archive.add(name,arcname=name)
          (output/'review.patch').write_bytes(subprocess.check_output(['git','diff','HEAD']))
          print(json.dumps({key:receipt[key] for key in ['parent','implementation','candidate','tree']},indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-reliability
          path: prepared-reliability
          retention-days: 1
          if-no-files-found: error
