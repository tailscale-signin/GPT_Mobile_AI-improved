name: Health Connect source snapshot
on:
  push:
    branches: [feat/smartwatch-health-connect-2026-10-11]
    paths: [.github/workflows/health-connect-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: health-connect-source
          path: source.tar
          retention-days: 1
