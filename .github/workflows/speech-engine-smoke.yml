name: Speech engine model smoke

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  model_workbench:
    name: Verify Kokoro model preparation and differential diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-verified model tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-kokoro-model-workbench.txt
      - name: Execute preparation, calibration and tensor-comparison regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m unittest discover -s scripts/tests -p test_kokoro_model_workbench.py -v 2>&1 | tee artifacts/model-artifact-tests.log
          python -m unittest discover -s local-kokoro-runtime/src/testHost -p test_kokoro_model_workbench.py -v 2>&1 | tee artifacts/model-workbench-tests.log
          python -c 'import hashlib,json,onnx,onnxruntime,numpy,pathlib; p=pathlib.Path("scripts/kokoro_model_workbench.py"); print(json.dumps({"sourceSha256":hashlib.sha256(p.read_bytes()).hexdigest(),"onnx":onnx.__version__,"onnxruntime":onnxruntime.__version__,"numpy":numpy.__version__,"physicalDeviceQualified":False},indent=2))' > artifacts/model-workbench-runtime.json
      - name: Verify QNN 2.8 embedded context compatibility on the host emulator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_qnn_host_probe.py --output-dir "$RUNNER_TEMP/qnn-context-host"
          LD_LIBRARY_PATH="$RUNNER_TEMP/qnn-context-host${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            python local-kokoro-runtime/src/testHost/kokoro_epcontext_compatibility_probe.py \
              --libraries "$RUNNER_TEMP/qnn-context-host" --ort-version 1.28.0 \
              --output artifacts/qnn-embedded-context.json 2>&1 | tee artifacts/qnn-embedded-context.log
      - name: Retain model tooling evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kokoro-model-workbench-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  native_context:
    name: Real Kokoro JNI lifecycle and compiled contexts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified model, native build and runtime inputs
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/prepare_kokoro_native_host.py --output-dir "$RUNNER_TEMP/kokoro-native-inputs" 2>&1 | tee artifacts/native-inputs.log
          cp "$RUNNER_TEMP/kokoro-native-inputs/inputs.json" artifacts/native-inputs.json
      - name: Compare the compact CPU duration trace with the public handset fixture
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-kokoro-model-workbench.txt
          pack="$RUNNER_TEMP/kokoro-native-inputs/pack"
          fixture="$RUNNER_TEMP/short-reference"
          trace="$RUNNER_TEMP/short-trace"
          capture="$RUNNER_TEMP/short-capture"
          python scripts/kokoro_model_workbench.py short-reference --pack "$pack" --output-dir "$fixture"
          python scripts/kokoro_model_workbench.py trace --duration-path --model "$pack/model.int8.onnx" \
            --model-sha256 75635ea3b85a32d00094dcdd61a258aba87c160f7c264c304a7b3ae9d734195e --output-dir "$trace"
          case_sha="$(jq -er .caseSha256 "$fixture/manifest.json")"
          python scripts/kokoro_model_workbench.py capture --model-manifest "$trace/manifest.json" \
            --case "$fixture/case.npz" --case-sha256 "$case_sha" --backend cpu --output-dir "$capture"
          python - "$capture/outputs.npz" <<'PYTHON'
          import sys
          import numpy as np
          with np.load(sys.argv[1], allow_pickle=False) as values:
              pcm, durations = values["audio"].ravel(), values["onnx::Shape_3411"].ravel()
              if pcm.size != 61200 or durations.size != 43 or durations.sum() != 102 or not np.all(np.isfinite(pcm)) or np.any(np.abs(pcm) >= 1):
                  raise SystemExit("Compact CPU output differs from the public fixture")
          PYTHON
          cp "$capture/manifest.json" artifacts/compact-short-cpu.json
      - name: Execute actual JNI lifecycle and full-model context store/load/recovery
        timeout-minutes: 33
        shell: bash
        run: |
          set -euo pipefail
          python local-kokoro-runtime/src/testHost/kokoro_native_profile_lifecycle.py \
            --native-source local-kokoro-runtime/src/main/cpp \
            --dependency-cache "$RUNNER_TEMP/kokoro-native-inputs/dependencies" \
            --ort "$RUNNER_TEMP/kokoro-native-inputs/ort" \
            --qnn "$RUNNER_TEMP/kokoro-native-inputs/qnn" --qnn-version 2.8.0 \
            --jdk "$JAVA_HOME" --cmake "$(command -v cmake)" \
            --pack "$RUNNER_TEMP/kokoro-native-inputs/pack" \
            --build-jobs 2 --output artifacts/native 2>&1 | tee artifacts/native-driver.log
      - name: Retain actual JNI and context qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kokoro-native-context-${{ github.sha }}
          path: |
            artifacts/native-inputs.json
            artifacts/compact-short-cpu.json
            artifacts/native-inputs.log
            artifacts/native-driver.log
            artifacts/native/*.json
            artifacts/native/*.log
            artifacts/native/host-port.diff
          if-no-files-found: error
          retention-days: 14
  checkpoint:
    name: Real ${{ matrix.engine }} checkpoint on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, phonon, pocket, pocket-multilingual]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install published runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgles2 libegl1 libgl1 libglib2.0-0t64 libportaudio2
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-voice-mediapipe-smoke.txt
      - name: Verify numerical speech reference controls
        timeout-minutes: 2
        run: python -m unittest discover -s local-kokoro-runtime/src/testHost -p test_kokoro_reference_comparison.py -v
      - name: Verify incremental input and cancellation controls
        timeout-minutes: 2
        run: python -m unittest discover -s scripts/tests -p test_mediapipe_speech.py -v
      - name: Execute the pinned checkpoint through the real SDK
        shell: bash
        env:
          SPEECH_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/smoke_mediapipe_speech.py \
            --engine "$SPEECH_ENGINE" \
            --output "artifacts/mediapipe-$SPEECH_ENGINE.json" \
            --model-dir "$RUNNER_TEMP/mediapipe-$SPEECH_ENGINE" \
            --timeout 300 2>&1 | tee "artifacts/mediapipe-$SPEECH_ENGINE.log"
      - name: Probe Kokoro GPU vocoder on the Linux host
        if: matrix.engine == 'kokoro'
        timeout-minutes: 8
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          POCL_DEVICES: pthread
          POCL_DEBUG: events
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends -y libegl-mesa0 libgl1-mesa-dri ocl-icd-libopencl1 pocl-opencl-icd clinfo
          clinfo -l | tee artifacts/opencl-devices.txt
          status=0
          python scripts/smoke_mediapipe_speech.py --engine kokoro-gpu \
            --output artifacts/mediapipe-kokoro-gpu.json --model-dir "$RUNNER_TEMP/mediapipe-kokoro-gpu" \
            --cpu-reference artifacts/mediapipe-kokoro.json --timeout 300 || status=$?
          if [[ "$status" == 77 ]] && jq -e '.status == "gpu_unavailable" and .gpu_dispatch == "none"' artifacts/mediapipe-kokoro-gpu.json >/dev/null; then
            echo 'The hosted software device could not initialize the Kokoro GPU delegate.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          else
            jq -r '"GPU request: \(.gpu_dispatch). CPU-reference comparison passed."' artifacts/mediapipe-kokoro-gpu.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain exact-source model and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speech-checkpoint-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
