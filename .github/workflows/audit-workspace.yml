name: Diagnostic audit validation

on:
  push:
    branches: [fix/diagnostic-audit-reliability-2026-10-11]
    paths: [.github/workflows/audit-workspace.yml]

permissions:
  contents: read

env:
  OBX_DISABLE_ANALYTICS: 'true'

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/diagnostic-audit-reliability-2026-10-11'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and apply audited source patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.audit/phase2-{i}.b64').read_text().strip() for i in (1, 2, 3, 4))
          # Restore three slash characters lost during text transport, then verify exact source integrity.
          for before, after in [('BqFv/3/z3/9', 'BqFv/3//z3/9'), ('TDpk/1r9ZE', 'TDpk//1r9ZE'), ('fvZj/Lq8Prk', 'fvZj//Lq8Prk')]:
              encoded = encoded.replace(before, after)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd0ec8b07e92dc9f597482fb64f89bcc3e017d45a11c47160f1c6bcb8ee2ce394', 'Patch integrity check failed'
          target = pathlib.Path('/tmp/diagnostic-audit.patch')
          target.write_bytes(patch)
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(target)], capture_output=True).returncode != 0:
              subprocess.run(['git', 'apply', '--check', str(target)], check=True)
              subprocess.run(['git', 'apply', str(target)], check=True)
          # Explicit JUnit imports in new tests; production source is not rewritten by this step.
          import re
          for p in pathlib.Path('app/src/test').rglob('*.kt'):
              if p.name in {'ProgressiveToolCatalogTest.kt', 'HealthExternalStoragePolicyTest.kt'}:
                  s = p.read_text()
                  names = sorted(set(re.findall(r'\b(assert\w+)\(', s)))
                  p.write_text(s.replace('import org.junit.Assert.*', '\n'.join('import org.junit.Assert.' + name for name in names)))
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Format changed Kotlin source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          git add -N app/src
          mapfile -d '' files < <(git diff --name-only -z 63bfbebde4c1ce1b74890a91c20517ae2dd4cc19 -- 'app/src/**/*.kt')
          java -jar "$RUNNER_TEMP/ktlint" --format "${files[@]}"
          java -jar "$RUNNER_TEMP/ktlint" "${files[@]}"
      - name: Commit source changes to the requested branch
        id: commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/diagnostic-audit-reliability-2026-10-11
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git add -- app/src
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: add generation safeguards, progressive tools and health privacy boundaries'
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Package formatted changed source for review
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'diff', '--name-only', '63bfbebde4c1ce1b74890a91c20517ae2dd4cc19', '--', 'app/src']).decode().splitlines()
          with zipfile.ZipFile('audit-formatted.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and p.suffix in {'.kt', '.xml'}:
                      z.write(p, name)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-formatted-source
          path: audit-formatted.zip
          retention-days: 2

  android:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Android unit tests, lint and debug compilation
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --continue --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug 2>&1 | tee audit-android.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-android-results
          path: |
            audit-android.log
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: diagnostic-audit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  preflight:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 0
      - name: Resource and patch validation
        run: |
          git diff --check 63bfbebde4c1ce1b74890a91c20517ae2dd4cc19 HEAD
          bash scripts/validate.sh resources
