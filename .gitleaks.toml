[[rules.allowlists]]
condition = "AND"
paths = ['''^docs/repairs/evidence/secret-history-finding-evidence/outer\.stdout\.log$''']
regexTarget = "line"
regexes = ['''^\s*\{"cases": \[\{"case": "intact_history", "exitCode": 0, "gitFatalObserved": false, "passed": true, "pinControls": 30, "pinControlsPassed": true, "scannerCompleted": true\}, \{"case": "missing_historical_blob", "exitCode": 128, "filenamePreflightExitCode": 0, "gitFatalObserved": true, "passed": true, "pinControls": 0, "pinControlsPassed": false, "scannerCompleted": false\}, \{"case": "restored_historical_blob", "exitCode": 0, "gitFatalObserved": false, "passed": true, "pinControls": 30, "pinControlsPassed": true, "scannerCompleted": true\}\], "passed": true, "scannerSha256": "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509", "scannerVersion": "8\.30\.1", "sourceInputsSha256": \{"\.gitleaks\.toml": "c7347823d82fd986509319383994945964a3510405de25ae63c9a13ba8800cc9", "\.gitleaksignore": "0c416dea2ec20fd56d7bc192c6f06eedb60a95f9e7236ba199fe094784484fd4", "app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/voice/KokoroModelPack\.kt": "4d3b59b9d02e3a7e07ce68d926fe8b9371d7bed7ae16d1e8b917768e6cee56cb", "app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/voice/VoiceCpuCalibrationProtocol\.kt": "3a1b01c95c39e1229656c696c001a58012bd4f747427e27e88400b8b6bae05be", "docs/repairs/evidence/speech-benchmark-1795470489503/combined-host-source-tests\.json": "32ae7dd7c706f871ef4211275c24fb2b75e2fad38b09d3d303f93f5292cab166", "docs/repairs/evidence/speech-playback-reliability-2026-11-23/native-qnn\.json": "c51174fc4a2aee2150c281050c16a7c6434fdbad96561a1a27fcf00ffb28ebdc", "docs/repairs/evidence/voice-cpu-gpu-npu-enhancements/single-cpu-waveform-validation\.json": "165927636314ba54ef6b2a4afc7bede1eb6c5c22df389de0b1061de02dacde14", "gradle/verification-metadata\.xml": "bd7589142cbe10fecacda69ac6f0487418719c9d77a5dcbb28b76565af95217f", "local-kokoro-runtime/src/testHost/kokoro_native_profile_lifecycle\.py": "fda17cf627be0057cb9439197107882506b66a80b066895e972ec4cc7d3bdb08", "scripts/report_secret_history\.py": "4bae92d11ea7f1fc7bc86d4eeb0bb344b364a70659