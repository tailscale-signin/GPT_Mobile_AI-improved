name: Finalize OpenRouter picker wiring

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/validate-openrouter-picker.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source formatting and remove workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/setting/PlatformSettingScreen.kt")
          source = path.read_text()
          old = '''                    if (platformData.compatibleType == ClientType.OPENROUTER && dialogState.isApiModelDialogOpen) {
              OpenRouterModelPickerDialog(
                  currentModel = platformData.model,
                  onDismiss = settingViewModel::closeApiModelDialog,
                  onModelSelected = settingViewModel::updateApiModel
              )
          } else {
              ModelDialog(dialogState, platformData.model, settingViewModel)
          }'''
          new = '''                    if (platformData.compatibleType == ClientType.OPENROUTER && dialogState.isApiModelDialogOpen) {
                        OpenRouterModelPickerDialog(
                            currentModel = platformData.model,
                            onDismiss = settingViewModel::closeApiModelDialog,
                            onModelSelected = settingViewModel::updateApiModel
                        )
                    } else {
                        ModelDialog(dialogState, platformData.model, settingViewModel)
                    }'''
          if old not in source:
              raise SystemExit("Expected OpenRouter picker block was not found")
          path.write_text(source.replace(old, new, 1))
          Path(".github/workflows/validate-openrouter-picker.yml").unlink()
      - name: Commit finalized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize OpenRouter model picker wiring"
          git push
