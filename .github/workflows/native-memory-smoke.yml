name: Minified native memory smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths:
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/telemetry/tool/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/delegation/**'
      - 'app/build.gradle.kts'
      - 'local-gguf-runtime/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'scripts/prepare_gguf_smoke.py'
      - 'scripts/check_gguf_android_smoke.py'
      - 'app/proguard-rules.pro'
      - 'app/app-native-smoke-rules.pro'
      - 'app/native-smoke-test-rules.pro'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/memory/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/data/memory/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/voice/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/data/voice/**'
      - 'local-kokoro-runtime/**'
      - 'gradle/**'
      - 'scripts/check_mediapipe_jni.py'
      - 'scripts/check_objectbox_jni.py'
      - 'scripts/check_local_runtime_apk.py'
      - 'scripts/check_native_memory_smoke.py'
      - 'scripts/tests/test_mediapipe_jni.py'
      - 'scripts/tests/test_objectbox_jni.py'
      - 'scripts/tests/test_native_memory_smoke.py'
      - 'scripts/run_native_memory_smoke.sh'
      - 'scripts/run_mediapipe_android_smoke.sh'
      - 'scripts/check_mediapipe_android_smoke.py'
      - 'scripts/tests/test_mediapipe_android_smoke.py'
      - 'scripts/smoke_mediapipe_speech.py'
      - '.github/workflows/native-memory-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-memory-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"
jobs:
  smoke:
    name: R8 and real JNI on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Provision verified memory model outside Gradle
        run: python3 scripts/provision_memory_model.py
      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh
      - name: Fetch immutable source and fixture
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/620d2225cc436ab0b001e3200e590e3b286ef9ab -o /tmp/llama.tar.gz
          echo '1d4a987d9bd048f6e93107e838026438df70fbde237fc0c69c63d600512b4bd9  /tmp/llama.tar.gz' | sha256sum --check
          mkdir -p /tmp/llama
          tar -xf /tmp/llama.tar.gz --strip-components=1 -C /tmp/llama
          python3 -m pip install numpy tqdm pyyaml
          python3 scripts/prepare_gguf_smoke.py /tmp/llama /tmp/gguf-fixture
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      # Kotlin/KSP run in process. Release each generation heap before the
      # production compiler and R8, as in the other bounded Android builds.
      - name: Generate native test app sources in a fresh process
        timeout-minutes: 15
        run: >-
          python3 scripts/gradle_retry.py --timeout-seconds 840 -- :app:kspNativeSmokeKotlin
          -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8'
      - name: Generate native test app annotations in a fresh process
        timeout-minutes: 15
        run: >-
          python3 scripts/gradle_retry.py --timeout-seconds 840 -- :app:kaptNativeSmokeKotlin
          -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8'
      - name: Compile native test app sources in a fresh process
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_android_compile_memory.py | tee native-smoke-production-memory.log
          python3 scripts/gradle_retry.py --timeout-seconds 1440 -- :app:compileNativeSmokeKotlin :app:compileNativeSmokeJavaWithJavac \
            -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8 -Xlog:gc:file=${RUNNER_TEMP}/native-smoke-production-gc.log:time,level,tags:filecount=2,filesize=8M"
      - name: Shrink the native test app in a separate process
        run: |
          # R8 retains its analysis heap until Gradle exits. Release it before
          # ApkFlinger allocates its packaging buffers.
          python3 scripts/gradle_retry.py -- :app:minifyNativeSmokeWithR8 -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m'
      - name: Run native release lint before packaging
        run: |
          # AGP's lint analysis also retains its heap until Gradle exits. On PR #761,
          # assemble ran lint after R8's process exited, then ApkFlinger exhausted
          # the 4 GiB heap reading native libraries. Preserve lint and release its
          # analysis process before allocating the packaging buffers.
          python3 scripts/gradle_retry.py -- :app:lintVitalNativeSmoke -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m'
      # ApkFlinger uses the common pool, independently of --max-workers. Serialize
      # native-library compression so simultaneous byte buffers cannot exhaust the heap.
      - name: Package the minified native test app in a fresh process
        run: |
          python3 scripts/gradle_retry.py -- :app:assembleNativeSmoke -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=1'
      - name: Build the native instrumentation APK in a fresh process
        run: |
          # KAPT stalled after R8 in the combined invocation. Release the app
          # compiler/optimizer process before compiling the test application.
          python3 scripts/gradle_retry.py -- :app:assembleNativeSmokeAndroidTest -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --info --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=1'
      - name: Verify the minified native package
        run: |
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_mediapipe_jni.py app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/nativeSmoke/*.apk
      - name: Stage one verified APK pair for every speech engine
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('app/build/outputs/apk')
          output = pathlib.Path('app/build/native-smoke-apks')
          output.mkdir(parents=True, exist_ok=True)
          selected = {
              'app-x86_64.apk': list(root.glob('nativeSmoke/*x86_64*.apk')),
              'test.apk': list(root.glob('androidTest/nativeSmoke/*.apk')),
          }
          manifest = {'schema': 'native-smoke-apks-v1', 'source_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'apks': {}}
          for name, candidates in selected.items():
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one {name}, found {len(candidates)}')
              destination = output / name
              shutil.copyfile(candidates[0], destination)
              with destination.open('rb') as source:
                  digest = hashlib.file_digest(source, 'sha256').hexdigest()
              manifest['apks'][name] = {'sha256': digest, 'bytes': destination.stat().st_size}
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Share the single minified app and instrumentation build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minified-native-smoke-apks
          path: app/build/native-smoke-apks/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Exercise encoder, vector index and GGUF CPU inference
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/run_native_memory_smoke.sh
      - name: Save native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: minified-native-memory-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/nativeSmoke/
            app/build/outputs/mapping/nativeSmokeAndroidTest/
            app/build/native-memory-smoke/
            native-smoke-production-memory.log
            ${{ runner.temp }}/native-smoke-production-gc.log*
          if-no-files-found: ignore

  speech:
    name: Android speech JNI (${{ matrix.engine }})
    needs: smoke
    runs-on: ubuntu-latest
    # Six minutes for the bounded model provisioner, five for emulator boot,
    # and six for the 300-second named test plus instrumentation teardown.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, phonon, pocket]
    env:
      MEDIAPIPE_SMOKE_EVIDENCE_DIR: app/build/native-speech-smoke/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set speech smoke staging paths
        run: |
          printf 'MEDIAPIPE_SMOKE_MODEL_DIR=%s/mediapipe-speech-models\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MEDIAPIPE_SMOKE_APK_DIR=%s/native-smoke-apks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Retrieve the verified APKs from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minified-native-smoke-apks
          path: ${{ env.MEDIAPIPE_SMOKE_APK_DIR }}
          digest-mismatch: error
      - name: Provision the exact catalog checkpoint outside Android
        timeout-minutes: 6
        run: >-
          python3 scripts/smoke_mediapipe_speech.py --engine '${{ matrix.engine }}'
          --download-only --model-dir "$MEDIAPIPE_SMOKE_MODEL_DIR"
          --output "$MEDIAPIPE_SMOKE_EVIDENCE_DIR/provisioning.json"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Require the named real-model speech JNI test
        timeout-minutes: 12
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 300
          ram-size: 3072M
          # The test reserves four checkpoint sizes for native cache/unpacking,
          # in addition to the APKs and the separately staged model.
          disk-size: 6G
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/run_mediapipe_android_smoke.sh '${{ matrix.engine }}'
      - name: Save per-engine JNI and cancellation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-speech-jni-${{ matrix.engine }}
          path: ${{ env.MEDIAPIPE_SMOKE_EVIDENCE_DIR }}/
          retention-days: 14
          if-no-files-found: error
