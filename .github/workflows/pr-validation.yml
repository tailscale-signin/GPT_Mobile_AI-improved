name: PR Validation

env:
  OBX_DISABLE_ANALYTICS: "true"

on:
  pull_request:
    # Changing draft status or retargeting a PR must re-run the completion gate.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
    branches:
      - main
      - feat/unified-reliability-v2-2026-10-13
      - master

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability_v2_completion:
    name: Unified Reliability v2 completion gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce v2 completion independently of draft status
        env:
          # Data-only env prevents branch-name script injection.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/check_unified_reliability_pr.py --head-ref "$HEAD_REF"

  validate:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest
    # Leave time for diagnostics after the individually bounded validation steps.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Android regex compatibility
        run: |
          python3 scripts/check_unified_reliability_v2.py
          python3 scripts/check_android_regex.py
          python3 -m unittest discover -s scripts/tests
          python3 scripts/test_gguf_prefill_governor.py

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Validate gateway Python and contract tests
        run: |
          python3 -m pip install --retries 6 --timeout 60 -r gateway/requirements.txt
          python3 -m py_compile gateway/gateway*.py
          python3 gateway/check_gateway.py

      - name: Resource preflight
        run: bash scripts/validate.sh resources

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Accept Android licenses
        env:
          GRADLE_LICENSE_ACCEPT: "y"
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > sdk-licenses.log 2>&1 || status=$?
          if [[ "${status:-0}" -ne 0 && "${status:-0}" -ne 141 ]]; then
            cat sdk-licenses.log
            exit "$status"
          fi
          if grep -Eq "[1-9][0-9]* of [0-9]+ SDK package licenses? not accepted" sdk-licenses.log; then
            cat sdk-licenses.log
            exit 1
          fi
          tail -n 20 sdk-licenses.log

      - name: Install Vulkan shader headers for Android GGUF backend
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev spirv-headers

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle Problem Matcher
        run: echo "::add-matcher::.github/gradle-problem-matcher.json"
        continue-on-error: true

      - name: Run Unit Tests & JaCoCo Coverage Report
        id: unit_tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --no-daemon --info 2>&1 | tee test.log || (echo "=== TEST FAILURE LOG ===" && tail -n 100 test.log && exit 1)
          python3 scripts/check_jacoco_coverage.py app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload generated statistics schema and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statistics-schema-and-tests
          path: |
            app/schemas/dev.chungjungsoo.gptmobile.data.telemetry.tool.ToolStatisticsDatabase/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.database.ChatDatabaseV2/*.json
            app/schemas/dev.chungjungsoo.gptmobile.data.research.feature.ResearchDatabase/*.json
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/unified-runtime-paired.json
          if-no-files-found: warn

      - name: Verify exported Room schemas
        if: always()
        run: python3 scripts/check_room_schemas.py

      - name: Run Android Lint
        id: android_lint
        # The expanded app's cold local lint pass took 19m29s; retain useful headroom.
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --info 2>&1 | tee lint.log || (echo "=== LINT FAILURE LOG ===" && tail -n 100 lint.log && exit 1)

      - name: Verify recovery and exports with a 256 MiB Java heap
        id: heap_recovery
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -I scripts/heap-stress.init.gradle :app:testDebugUnitTest --no-daemon \
            --tests '*ResearchSessionStoreHeapTest' --tests '*StreamingDebugBundleTest' \
            --tests '*BenchmarkStreamingExportHeapTest' \
            --tests '*BenchmarkColdStreamingExportHeapTest' 2>&1 | tee heap.log

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: "Unit Test Results"
          fail_on_failure: false
          require_tests: false

      - name: Build review APK and verify packaged runtime
        id: review_apk
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee apk.log
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            python3 scripts/check_research_dispatch_size.py "$apk"
          done

      - name: Upload review APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

      - name: Upload dependency verification failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-verification
          path: '**/build/reports/dependency-verification/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload validation logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-validation-logs
          path: |
            test.log
            heap.log
            lint.log
            apk.log
            app/build/test-results/heapRecovery/*.xml
            app/build/reports/reliability-ui/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate PR Step Summary
        if: always()
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          ANDROID_LINT_OUTCOME: ${{ steps.android_lint.outcome }}
          HEAP_RECOVERY_OUTCOME: ${{ steps.heap_recovery.outcome }}
          REVIEW_APK_OUTCOME: ${{ steps.review_apk.outcome }}
        run: |
          {
            echo "## CI Validation Summary"
            echo
            echo "| Validation | Result |"
            echo "| --- | --- |"
            printf '| Unit tests and coverage | %s |\n' "${UNIT_TEST_OUTCOME:-not run}"
            printf '| Android lint | %s |\n' "${ANDROID_LINT_OUTCOME:-not run}"
            printf '| 256 MiB recovery and export gate | %s |\n' "${HEAP_RECOVERY_OUTCOME:-not run}"
            printf '| APK build and runtime verification | %s |\n' "${REVIEW_APK_OUTCOME:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
