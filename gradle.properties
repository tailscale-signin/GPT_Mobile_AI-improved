# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM memory ceiling and worker settings for CI/CD runners (GitHub Actions runners provide 7GB RAM + swap)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
# Keep compiler/KSP work in the same bounded process; separate daemons can
# retain several GiB between lint, benchmark and instrumented-test variants.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
# ObjectBox 5.4.2 retains a Gradle Project in objectboxPrepareBuild, so cache
# serialization is discarded. Disable it until the plugin supports Gradle 9.
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false

# Optimize local builds and incremental compilation
kotlin.incremental=true

# AndroidX package structure
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false

# Allow KSP and Kotlin compiler memory configuration
ksp.run.in.process=true
ksp.use.classpath.args=true
