name: Gateway Windows installer
on:
  push:
    branches: [main]
  pull_request:
    paths: ['gateway/**', '.github/workflows/gateway-windows-installer.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Windows installer and update ZIP from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gateway-installer-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Native transport behavior contracts
        run: dotnet run --project gateway/desktop/native/tests/Gateway.Native.Contracts.csproj -c Release
      - name: Cross-build native Windows dashboard
        run: dotnet build gateway/desktop/native/Gateway.Desktop.csproj -c Release

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - run: python -m pip install --require-hashes -r gateway/desktop/requirements-build.txt
      - run: python -m unittest discover -s gateway/tests -p 'test_gateway_desktop*.py'
      - run: python -m unittest discover -s gateway/tests -p test_gateway_network.py
      - run: python -m unittest discover -s gateway/tests -p test_gateway_dashboard.py
      - name: Native desktop protocol contracts
        run: dotnet run --project gateway/desktop/native/tests/Gateway.Native.Contracts.csproj -c Release
      - run: python gateway/desktop/build_windows.py
      - run: python gateway/desktop/smoke_windows.py
      - name: Verify the v17-to-v18 transition package
        run: python gateway/desktop/build_v17_transition.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Gateway-Windows-x64
          path: |
            dist/windows/*-setup.exe
            dist/windows/*.zip
            dist/windows/v17-transition/*
            dist/windows/SHA256SUMS.txt
            dist/windows/smoke-results.json
            dist/windows/setup-*.png
            dist/windows/dashboard-*.png
            dist/windows/settings-*.png
            dist/windows/native-*.png
            dist/windows/native-*-smoke.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: Gateway-Windows-diagnostics
          path: |
            dist/windows/*.log
            dist/windows/smoke-failure.json
            dist/windows/native-*-failure.txt
          if-no-files-found: ignore

  attest-windows-packages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native-cross-build, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Retrieve tested Windows packages from this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Gateway-Windows-x64 --dir dist/windows
      - name: Sign provenance for Windows installers and portable archives
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        id: windows_attestation
        with:
          subject-path: |
            dist/windows/**/Gateway-*-windows-x64-setup.exe
            dist/windows/**/Gateway-*-windows-x64.zip
      - name: Retain the Windows package attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-attestation-bundle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.windows_attestation.outputs.bundle-path }}
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: attest-windows-packages
    concurrency: gateway-release-publication
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-source release checks
        run: python3 scripts/await_release_checks.py --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --timeout 6900 --require-main-push "Gateway Windows installer"
      - name: Retrieve Windows packages from this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Gateway-Windows-x64 --dir dist/windows
      - name: Verify packages and publish stable Gateway release
        run: bash scripts/publish_gateway_windows.sh
