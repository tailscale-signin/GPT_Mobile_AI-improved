name: PR Validation

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  validate:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses & install platform SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Run Unit Tests & Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
