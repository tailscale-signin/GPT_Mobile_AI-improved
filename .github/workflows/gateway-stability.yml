name: Gateway stability
on:
  pull_request:
    paths: ['gateway/**', '.github/workflows/gateway-stability.yml']
  push:
    branches: ['main', 'feat/gateway-v14-1-stability-2026-10-10']
    paths: ['gateway/**', '.github/workflows/gateway-stability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - run: python gateway/gateway.py validate-config
      - run: python gateway/check_gateway.py
