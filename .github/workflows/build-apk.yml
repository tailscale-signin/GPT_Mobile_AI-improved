name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**/*.md'
      - 'LICENSE'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
      - scripts/check_apk_size.py
      - scripts/tests/test_check_apk_size.py

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          python3 scripts/check_qnn_provenance.py
          ./gradlew assembleDebug --no-daemon --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8'

      - name: Verify local runtime native libraries
        run: python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk

      - name: Check measured APK size budgets
        run: python3 scripts/check_apk_size.py app/build/outputs/apk/debug --build-type debug --report apk-size-report.json

      - name: Save APK size diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: debug-apk-size-${{ github.sha }}
          path: apk-size-report.json
          if-no-files-found: ignore

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
