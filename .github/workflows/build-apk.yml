name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space and free disk memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --info --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Build Release APK
        id: build-release
        run: ./gradlew assembleRelease --no-daemon --info --stacktrace
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Sign APKs with apksigner
        run: |
          echo "Setting up keystore for APK signing..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias gptmobile \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "gptmobile-ci-release-key" \
            -keypass "gptmobile-ci-release-key" \
            -dname "CN=GPT Mobile Improved, OU=Development, O=OpenSource, L=Global, ST=Global, C=XX"

          mkdir -p app/build/outputs/apk/release/signed/
          FOUND_APKS=$(find app/build/outputs/apk/ -type f -name "*.apk" ! -path "*/signed/*")

          for apk in $FOUND_APKS; do
            echo "Signing $apk..."
            basename=$(basename "$apk")
            signed_apk="app/build/outputs/apk/release/signed/$basename"

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks release.keystore \
              --ks-pass "pass:gptmobile-ci-release-key" \
              --ks-key-alias gptmobile \
              --key-pass "pass:gptmobile-ci-release-key" \
              --out "$signed_apk" \
              "$apk"

            $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$signed_apk"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/signed/*.apk
          if-no-files-found: ignore

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/signed/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - Valid, signed, and aligned release APKs ready for install.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
