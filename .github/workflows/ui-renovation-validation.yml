name: UI renovation device checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/presentation/**'
      - '.github/workflows/ui-renovation-validation.yml'
      - 'scripts/run_ui_renovation_checks.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-renovation-device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"

jobs:
  compose:
    name: Compose behavior on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Build UI test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PenableAbiSplits=false --no-daemon
      - name: Execute renovation and composer behavior checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/run_ui_renovation_checks.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ui-renovation-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-renovation-evidence/
