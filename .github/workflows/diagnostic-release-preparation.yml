name: Prepare diagnostic release candidate
on:
  push:
    branches: [fix/diagnostic-workflow-evidence-2026-11-06]
    paths: ['.github/workflows/diagnostic-release-preparation.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare versioned source objects with unchanged qualification gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1fc43c89fb73abb61607a11dc83fd7b532d78910
          python3 - <<'PY'
          import base64, hashlib, importlib.util, json, os, pathlib, subprocess, tarfile, urllib.error, urllib.parse, urllib.request
          P = pathlib.Path
          repo = 'tailscale-signin/GPT_Mobile_AI-improved'
          branch = 'fix/diagnostic-workflow-evidence-2026-11-06'
          head = os.environ['GITHUB_SHA']
          version = '0.9.66.6'
          workflow = '.github/workflows/diagnostic-release-preparation.yml'
          assert os.environ['GITHUB_REPOSITORY'] == repo and os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def api(path, payload=None, missing_ok=False):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  method='GET' if payload is None else 'POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404: return None
                  raise
          assert api('/git/ref/heads/' + urllib.parse.quote(branch, safe=''))['object']['sha'] == head, 'Branch moved'
          assert api('/releases/tags/v' + version, missing_ok=True) is None, 'Release already exists'
          assert not any(row['ref'] == 'refs/tags/v' + version for row in api('/git/matching-refs/tags/v' + version)), 'Tag already exists'
          spec = importlib.util.spec_from_file_location('prepare_release', 'scripts/prepare_release.py')
          helper = importlib.util.module_from_spec(spec); spec.loader.exec_module(helper)
          build = P('app/build.gradle.kts')
          before = build.read_text()
          assert 'versionName = "0.9.66.5"' in before and 'versionCode = 139' in before, 'Version changed'
          updated, code = helper.bump(before, version)
          assert code == 140
          build.write_text(updated)
          scope_path = P('release-scope.json')
          scope = json.loads(scope_path.read_text())
          assert scope['qualification'] == 'scoped' and scope['version'] == '0.9.66.5' and scope['versionCode'] == 139
          scope['version'] = version; scope['versionCode'] = code
          scope_path.write_text(json.dumps(scope, indent=2) + '\n')
          lines = ['# GPT Mobile ' + version, '', 'Android build 140. Scoped diagnostic-reliability release candidate.', '',
              'This candidate combines the November 6 GitHub, gateway, retained-evidence and Android responsiveness repairs. Publication requires fresh verification of this exact source revision and the resulting main revision.', '', '## Changes', '']
          lines += ['- ' + item for item in scope['changes']]
          lines += ['', '## Implementation and verification', '',
              'Implementation reports: [diagnostic workflow](docs/repairs/diagnostic-workflow-evidence-2026-11-06.md), [gateway, acceptance and retention](docs/repairs/gateway-task-retention-2026-11-06.md), and [GraphQL recovery and dispatch correlation](docs/repairs/github-dispatch-graphql-2026-11-06.md).', '',
              'The existing signed-release pipeline verifies exact-commit tests, required main checks, packaged runtimes, privacy, signing-certificate continuity, APK/AAB identities, checksums, provenance and downloaded publication assets. Earlier green revisions do not qualify this candidate. No release, tag or successful device measurement is implied by preparation of these notes.', '', '## Qualification and remaining work', '']
          lines += ['- ' + item for item in scope['limitations']]
          P('RELEASE_NOTES.md').write_text('\n'.join(lines) + '\n')
          changelog = P('CHANGELOG.md')
          old_log = changelog.read_text()
          changelog.write_text('# 0.9.66.6 — Diagnostic reliability\n\n- Verified task completion, stale-ref recovery, protected result retention, gateway recovery and correlated diagnostics.\n- Off-main startup/workspace persistence, reduced rendering churn and additional regression/benchmark coverage.\n- Durable ready-for-review mutation recovery and exact remote readback without replaying uncertain writes.\n- Build 140; scoped qualification and all unmeasured device/deployment boundaries are retained in RELEASE_NOTES.md.\n\n' + old_log)
          P(workflow).unlink()
          paths = ['app/build.gradle.kts', 'release-scope.json', 'RELEASE_NOTES.md', 'CHANGELOG.md', workflow]
          subprocess.run(['git', 'add', '-A', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          spec = importlib.util.spec_from_file_location('check_release_scope', 'scripts/check_release_scope.py')
          check = importlib.util.module_from_spec(spec); spec.loader.exec_module(check)
          assert check.validate(P.cwd(), scope, paths[:-1]) == 'scoped'
          subprocess.run(['python3', 'scripts/check_unified_reliability_v2.py'], check=True)
          entries = []; hashes = {}
          for name in paths:
              if name == workflow:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None}); continue
              content = P(name).read_bytes()
              blob = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              hashes[name] = hashlib.sha256(content).hexdigest()
          parent = api('/git/commits/' + head)
          tree = api('/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = api('/git/commits', {'message': 'Prepare v0.9.66.6 build 140 with truthful scoped qualification', 'tree': tree['sha'], 'parents': [head], 'author': {'name': 'github-actions[bot]', 'email': '41898282+github-actions[bot]@users.noreply.github.com'}})
          P('release-candidate.json').write_text(json.dumps({'expected_parent': head, 'commit_sha': commit['sha'], 'tree_sha': tree['sha'], 'version': version, 'version_code': code, 'files_sha256': hashes, 'branch_moved': False, 'published': False, 'ci': 'NOT_RUN'}, indent=2) + '\n')
          P('release-candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary', 'HEAD']))
          with tarfile.open('release-candidate-source.tar.gz', 'w:gz') as archive:
              for name in hashes: archive.add(name, arcname=name)
          print('Prepared candidate object:', commit['sha'])
          print('No branch, tag or release was published. Existing CI and release gates are unchanged.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: prepared-release-candidate
          path: |
            release-candidate.json
            release-candidate.patch
            release-candidate-source.tar.gz
          retention-days: 1
          if-no-files-found: error
