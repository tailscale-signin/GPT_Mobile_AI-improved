name: Generate Release Version

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release-*

jobs:
  build:
    name: Build and Sign Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Configure swap space for CI stability
        run: |
          echo "Setting up 6GB swap space to prevent runner OOM during release packaging and dexing..."
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 6G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=6144
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Keystore
        id: setup-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using deterministic release keystore configuration"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias gptmobile \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "gptmobile-deterministic-release-key" \
              -keypass "gptmobile-deterministic-release-key" \
              -dname "CN=GPT Mobile Improved, OU=Development, O=OpenSource, L=Global, ST=Global, C=XX"
            echo "KEYSTORE_PASSWORD=gptmobile-deterministic-release-key" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=gptmobile" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=gptmobile-deterministic-release-key" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          echo "Building Release APK with Gradle..."
          ./gradlew assembleRelease --no-daemon --info 2>&1 | tee gradle-release.log || (echo "=== GRADLE FAILURE LOG ===" && tail -n 150 gradle-release.log && exit 1)

      - name: Build Release Bundle
        run: |
          echo "Building Release Bundle..."
          ./gradlew bundleRelease --no-daemon --info || echo "Bundle build skipped or non-fatal"

      - name: Sign APKs with apksigner
        run: |
          echo "Locating built APKs in app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true

          mkdir -p app/build/outputs/apk/release/signed/

          # Sign all generated split & universal release APKs
          for apk in $(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*-signed.apk"); do
            echo "Signing $apk..."
            basename=$(basename "$apk")
            signed_apk="app/build/outputs/apk/release/signed/$basename"

            $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$signed_apk" \
              "$apk"

            $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$signed_apk"
          done

          # Standardize canonical release APK names
          if [ -f "app/build/outputs/apk/release/signed/app-universal-release.apk" ]; then
            cp -f "app/build/outputs/apk/release/signed/app-universal-release.apk" app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/release/signed/app-arm64-v8a-release.apk" ]; then
            cp -f "app/build/outputs/apk/release/signed/app-arm64-v8a-release.apk" app/build/outputs/apk/release/app-release.apk
          fi

          echo "Successfully signed APKs:"
          ls -la app/build/outputs/apk/release/signed/

      - name: Sign AAB with jarsigner
        run: |
          echo "Locating built AAB in app/build/outputs/bundle/release/:"
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || true

          RAW_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$RAW_AAB" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$RAW_AAB" \
              "$KEY_ALIAS"
            cp -f "$RAW_AAB" app/build/outputs/bundle/release/app-release.aab
            echo "Successfully signed AAB."
          else
            echo "No AAB found to sign, skipping AAB signing."
          fi

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-release-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/signed/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-release-bundle-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION_NAME (code: $VERSION_CODE)"

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version_info.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        run: |
          echo "Publishing GitHub Release for tag: $TAG_NAME"

          ASSETS_TO_UPLOAD=()
          for signed in app/build/outputs/apk/release/signed/*.apk; do
            if [ -f "$signed" ]; then
              ASSETS_TO_UPLOAD+=("$signed")
            fi
          done

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            ASSETS_TO_UPLOAD+=("app/build/outputs/bundle/release/app-release.aab")
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading/overwriting release assets..."
            gh release upload "$TAG_NAME" "${ASSETS_TO_UPLOAD[@]}" --clobber
          else
            echo "Creating fresh GitHub Release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              "${ASSETS_TO_UPLOAD[@]}" \
              --title "$TAG_NAME - GPT Mobile Improved" \
              --notes "Automated release build for $TAG_NAME (Package: dev.chungjungsoo.gptmobile.improved). Includes ABI-split APKs (arm64-v8a, x86_64, universal)."
          fi
          echo "GitHub Release $TAG_NAME published successfully."
