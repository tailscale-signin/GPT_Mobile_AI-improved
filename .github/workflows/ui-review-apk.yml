name: UI Review APK
on:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths:
      - 'app/**'
      - '.github/workflows/ui-review-apk.yml'
      - 'macrobenchmark/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-review-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OBX_DISABLE_ANALYTICS: "true"
jobs:
  apk:
    name: Build draft review APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OBX_DISABLE_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Install Vulkan shader headers for Android GGUF backend
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev spirv-headers
      # Separate invocations release compiler/KSP memory between build variants.
      # Bound each phase so a stalled compiler cannot occupy a runner for six hours.
      - name: Build review APK
        timeout-minutes: 30
        # Native-library packaging needs more heap after a cold Kotlin/KSP compile.
        # Keep the compiler in-process and one worker within the runner's RAM budget.
        run: >-
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain --max-workers=1
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8'
      - name: Compile device regressions
        timeout-minutes: 25
        run: ./gradlew :app:compileDebugAndroidTestKotlin --no-daemon --stacktrace --console=plain
      - name: Compile benchmark regressions
        timeout-minutes: 30
        run: ./gradlew :app:compileBenchmarkKotlin :macrobenchmark:compileBenchmarkKotlin --no-daemon --stacktrace --console=plain
      - name: Verify packaged local runtime and privacy
        run: |
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
          for apk in app/build/outputs/apk/debug/*.apk; do
            python3 scripts/check_research_dispatch_size.py "$apk"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: draft-review-apk-${{ github.event.pull_request.number || github.run_id }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Review instructions
        run: |
          echo 'Download the draft-review-apk artifact below for this exact commit. Device verification is still required; compiling instrumentation tests does not execute them.' >> "$GITHUB_STEP_SUMMARY"
