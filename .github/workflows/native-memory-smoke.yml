name: Minified native memory smoke

on:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths:
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/telemetry/tool/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/delegation/**'
      - 'app/build.gradle.kts'
      - 'local-gguf-runtime/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'scripts/prepare_gguf_smoke.py'
      - 'scripts/check_gguf_android_smoke.py'
      - 'app/proguard-rules.pro'
      - 'app/app-native-smoke-rules.pro'
      - 'app/native-smoke-test-rules.pro'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/memory/**'
      - 'app/src/androidTest/kotlin/dev/chungjungsoo/gptmobile/data/memory/**'
      - 'gradle/**'
      - 'scripts/check_mediapipe_jni.py'
      - 'scripts/check_objectbox_jni.py'
      - 'scripts/check_local_runtime_apk.py'
      - 'scripts/check_native_memory_smoke.py'
      - 'scripts/tests/test_mediapipe_jni.py'
      - 'scripts/tests/test_objectbox_jni.py'
      - 'scripts/tests/test_native_memory_smoke.py'
      - 'scripts/run_native_memory_smoke.sh'
      - '.github/workflows/native-memory-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-memory-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"
jobs:
  smoke:
    name: R8 and real JNI on Android 16
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Install Vulkan shader headers for Android GGUF backend
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev spirv-headers
      - name: Fetch immutable source and fixture
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/620d2225cc436ab0b001e3200e590e3b286ef9ab -o /tmp/llama.tar.gz
          echo '1d4a987d9bd048f6e93107e838026438df70fbde237fc0c69c63d600512b4bd9  /tmp/llama.tar.gz' | sha256sum --check
          mkdir -p /tmp/llama
          tar -xf /tmp/llama.tar.gz --strip-components=1 -C /tmp/llama
          python3 -m pip install numpy tqdm pyyaml
          python3 scripts/prepare_gguf_smoke.py /tmp/llama /tmp/gguf-fixture
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Shrink the native test app in a separate process
        run: |
          # In-process Kotlin/KSP and R8 retain their analysis heap until Gradle exits.
          # Release it before ApkFlinger allocates its packaging buffers.
          ./gradlew :app:minifyNativeSmokeWithR8 -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m'
      # ApkFlinger uses the common pool, independently of --max-workers. Serialize
      # native-library compression so simultaneous byte buffers cannot exhaust the heap.
      - name: Package the minified native test app in a fresh process
        run: |
          ./gradlew :app:assembleNativeSmoke -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=1'
      - name: Build the native instrumentation APK in a fresh process
        run: |
          # KAPT stalled after R8 in the combined invocation. Release the app
          # compiler/optimizer process before compiling the test application.
          ./gradlew :app:assembleNativeSmokeAndroidTest -PnativeMemorySmoke=true --no-daemon --max-workers=1 --console=plain --info --stacktrace '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=1'
      - name: Verify the minified native package
        run: |
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/nativeSmoke/*.apk
      - name: Exercise encoder, vector index and GGUF CPU inference
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/run_native_memory_smoke.sh
      - name: Save native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minified-native-memory-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/mapping/nativeSmoke/
            app/build/outputs/mapping/nativeSmokeAndroidTest/
            app/build/native-memory-smoke/
          if-no-files-found: ignore
