name: Crawler contracts

on:
  pull_request:
    paths:
      - 'mcp/crawler/**'
      - '.github/workflows/crawler-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install isolated crawler dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/crawler-env"
          "$RUNNER_TEMP/crawler-env/bin/python" -m pip install ./mcp/crawler
      - name: Verify storage, metering, extraction and authenticated transports
        working-directory: mcp/crawler
        run: |
          "$RUNNER_TEMP/crawler-env/bin/python" -W error::ResourceWarning -m unittest discover -s tests -v
          "$RUNNER_TEMP/crawler-env/bin/python" -m compileall -q crawler_server
