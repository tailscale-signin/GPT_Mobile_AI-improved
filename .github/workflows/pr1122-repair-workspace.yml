name: PR 1122 repair workspace

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr1122-repair-workspace.yml'

permissions:
  contents: read

concurrency:
  group: pr1122-repair-workspace
  cancel-in-progress: true

jobs:
  source:
    if: github.event.pull_request.number == 1122 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture only tracked source at the exact reviewed head
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr1122-workspace"
          git rev-parse HEAD > "$RUNNER_TEMP/pr1122-workspace/head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr1122-workspace/source.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1122-repair-workspace
          path: ${{ runner.temp }}/pr1122-workspace
          retention-days: 1
          if-no-files-found: error
