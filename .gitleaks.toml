[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Each matching line is a single filename-to-digest entry produced by the
# Gateway manifest or a source inventory. Other fields and rules still scan.
[[rules.allowlists]]
condition = "AND"
paths = ['''^gateway/manifest-v14\.json$''', '''^docs/(engineering|repairs)/.*\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[^"]+\.(py|kt)":\s*"[0-9a-f]{40}([0-9a-f]{24})?",?\s*$''']

# This generated entry is the SHA-256 of the canonical token mapping fixture.
# Its bytes are independently checked by the Gateway manifest validator.
[[rules.allowlists]]
condition = "AND"
paths = ['''^gateway/manifest-v14\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tests/fixtures/voice-frontend-tokens\.json":\s*"[0-9a-f]{64}",?\s*$''']

# This exact schema label describes a token-count approximation, not an API key.
# A different field/value, another path, or extra content on the line still scans.
[[rules.allowlists]]
condition = "AND"
paths = ['''^gateway/v14/task_context\.py$''']
regexTarget = "line"
regexes = ['''^\s*'token_estimate_method': 'UTF8_BYTES_DIVIDED_BY_FOUR',\s*$''']

# Exact public model-file pin, checked by this harness and exported in its receipt.
# Other hashes, fields and paths remain subject to the complete rule set.
[[rules.allowlists]]
condition = "AND"
paths = ['''^local-kokoro-runtime/src/testHost/kokoro_native_profile_lifecycle\.py$''', '''^docs/repairs/evidence/speech-playback-reliability-2026-11-23/native-qnn\.json$''', '''^docs/repairs/evidence/voice-cpu-gpu-npu-enhancements/single-cpu-waveform-validation\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokens\.txt": "6ebb6bb288f20f3ae8d004d3c2ca27697da27c037d75e81a60e2a6a663f95425",\s*$''']

# Exact public SharedPreferences names for the version 3 and 4 CPU-calibration order.
# Other declarations, values, paths and trailing content continue to scan.
[[rules.allowlists]]
condition = "AND"
paths = ['''^app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/voice/VoiceCpuCalibrationProtocol\.kt$''']
regexTarget = "line"
regexes = ['''^\s*const val ORDER_KEY = "cpu-calibration-order-v[34]"\s*$''']

# Exact public MockK artifact checksum in the recorded host-test evidence.
# The scanner controls bind it to Gradle's approved dependency pin. Other
# filenames, values, paths and surrounding content continue to scan.
[[rules.allowlists]]
condition = "AND"
paths = ['''^docs/repairs/evidence/speech-benchmark-1795470489503/combined-host-source-tests\.json$''']
regexTarget = "line"
regexes = ['''^\s*"mockk-agent-api-jvm-1\.14\.11\.jar": "9459d7eb7694b6e0039e19f7d1a89dfc7ae1fa782ff8d38f2952bda1ffa39242",\s*$''']

