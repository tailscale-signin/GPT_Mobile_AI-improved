name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space and free disk memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | tee gradle-debug-build.log
          echo "Listing debug build outputs:"
          ls -laR app/build/outputs/apk/ || true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Build Release APK
        id: build_release
        run: |
          ./gradlew assembleRelease --no-daemon --info --stacktrace 2>&1 | tee gradle-release-build.log
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.build_release.outcome == 'success'
        id: upload-release
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: ignore

      - name: Report Build Failure as GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          ERROR_SNIPPET="No build log captured"
          if [ -f gradle-debug-build.log ]; then
            ERROR_SNIPPET=$(grep -E -A 10 -B 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:)" gradle-debug-build.log | tail -n 60 || true)
            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET=$(tail -n 60 gradle-debug-build.log)
            fi
          elif [ -f gradle-release-build.log ]; then
            ERROR_SNIPPET=$(grep -E -A 10 -B 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:)" gradle-release-build.log | tail -n 60 || true)
            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET=$(tail -n 60 gradle-release-build.log)
            fi
          fi

          ISSUE_TITLE="CI Build Failure on $REF_NAME (${COMMIT_SHA:0:7})"

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number')

          BODY_FILE=$(mktemp)
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for this build failure."
            cat <<'EOF' > "$BODY_FILE"
Build failure reoccurred on run: RUN_URL_PLACEHOLDER

```
ERROR_SNIPPET_PLACEHOLDER
```
EOF
            sed -i "s|RUN_URL_PLACEHOLDER|$RUN_URL|g" "$BODY_FILE"
            python3 -c "
import sys
content = open('$BODY_FILE').read()
err = sys.stdin.read()
open('$BODY_FILE', 'w').write(content.replace('ERROR_SNIPPET_PLACEHOLDER', err))
" <<< "$ERROR_SNIPPET"
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            cat <<'EOF' > "$BODY_FILE"
### 🚨 Automated CI Build Failure Report

**Workflow:** WORKFLOW_NAME_PLACEHOLDER
**Branch / Ref:** `REF_NAME_PLACEHOLDER`
**Commit:** `COMMIT_SHA_PLACEHOLDER`
**Run Details:** [View Actions Run](RUN_URL_PLACEHOLDER)

---

### Exact Build Error / Failure Log (For AI & Maintainers)
```text
ERROR_SNIPPET_PLACEHOLDER
```

---
*Generated automatically by CI workflow.*
EOF
            sed -i "s|WORKFLOW_NAME_PLACEHOLDER|$WORKFLOW_NAME|g" "$BODY_FILE"
            sed -i "s|REF_NAME_PLACEHOLDER|$REF_NAME|g" "$BODY_FILE"
            sed -i "s|COMMIT_SHA_PLACEHOLDER|$COMMIT_SHA|g" "$BODY_FILE"
            sed -i "s|RUN_URL_PLACEHOLDER|$RUN_URL|g" "$BODY_FILE"
            python3 -c "
import sys
content = open('$BODY_FILE').read()
err = sys.stdin.read()
open('$BODY_FILE', 'w').write(content.replace('ERROR_SNIPPET_PLACEHOLDER', err))
" <<< "$ERROR_SNIPPET"
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label "build-failure,bug" \
              --body-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - Debug build of GPT Mobile AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
