name: GenieX preview validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gradle_retry.py'
      - 'scripts/tests/test_gradle_retry.py'
      - 'app/src/geniex/**'
      - 'app/src/litertOnly/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localmodel/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'scripts/check_local_runtime_apk.py'
      - 'docs/audits/geniex-preview-native-libraries.json'
      - '.github/workflows/geniex-preview.yml'

permissions:
  contents: read

concurrency:
  group: geniex-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"

jobs:
  preview:
    runs-on: ubuntu-latest
    # Independent compile/test/package stages, plus setup and artifact audits.
    # The arm64 GenieX QAIRT package includes a large libQnnHtpPrepare payload;
    # keep the job bounded while allowing cold-run ApkFlinger packaging to finish.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers
      # Keep cold compilation out of the complete suite's execution deadline.
      - name: Compile isolated preview unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-unit-compile --output build/geniex-validation/unit-compile-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac --no-daemon --console=plain --stacktrace --profile 2>&1 | tee build/geniex-validation/unit-compile.log
      - name: Run isolated preview unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-unit-tests --output build/geniex-validation/unit-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true :app:testDebugUnitTest --no-daemon --console=plain --stacktrace --profile 2>&1 | tee build/geniex-validation/unit.log
      - name: Save GenieX unit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 14
          name: geniex-unit-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Build isolated preview APK
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-debug --output build/geniex-validation/debug-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true :app:assembleDebug --no-daemon --console=plain --stacktrace --profile 2>&1 | tee build/geniex-validation/debug.log
      - name: Validate release shrinker for the GenieX runtime
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          # Match native-memory-smoke.yml: release compiler/KSP/R8 analysis
          # memory before ApkFlinger allocates its packaging buffers.
          python3 scripts/build_metrics.py --label geniex-shrinker --output build/geniex-validation/shrinker-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true -PnativeMemorySmoke=true :app:minifyNativeSmokeWithR8 --no-daemon --max-workers=1 --console=plain --info --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/shrinker.log
      # ApkFlinger uses the common pool, independently of --max-workers. Serialize
      # native-library compression so simultaneous byte buffers cannot exhaust the heap.
      # This phase can legitimately outlast compilation on a cold runner; the previous
      # 25- and 45-minute bounds terminated Gradle during active packaging without an
      # error after AAPT2 had completed. Keep this as one bounded, independently
      # auditable stage rather than weakening the native stack checks below.
      - name: Package the minified GenieX APK in a fresh process
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-package --output build/geniex-validation/package-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true -PnativeMemorySmoke=true :app:assembleNativeSmoke --no-daemon --max-workers=1 --console=plain --info --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=1 -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/package.log
      - name: Audit minified GenieX native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/nativeSmoke/*.apk
      - name: Audit resolved Maven AAR
        run: python3 scripts/audit_geniex_aar.py --output app/build/reports/geniex-maven-artifact.json
      - name: Audit packaged native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
      - name: Index versioned GenieX candidates
        run: python3 scripts/artifact_manifest.py --root app/build/outputs/apk --runtime geniex --output build/geniex-validation/artifact-index.json
      - name: Save GenieX validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 30
          name: geniex-validation-diagnostics
          path: |
            build/geniex-validation/
            build/reports/profile/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: geniex-preview-debug
          path: |
            build/geniex-validation/artifact-index.json
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/nativeSmoke/*.apk
            app/build/reports/geniex-maven-artifact.json
          if-no-files-found: error
