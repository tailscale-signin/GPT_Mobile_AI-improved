name: v0.9.50 Android acceptance
on:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths: ['app/**', 'scripts/run_release0950_acceptance.sh', '.github/workflows/release-0950-acceptance.yml']
  push:
    branches: [main]
    paths: ['app/**', 'scripts/run_release0950_acceptance.sh', '.github/workflows/release-0950-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-0950-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - run: sudo chmod 666 /dev/kvm
      - name: Install Vulkan build prerequisites
        timeout-minutes: 8
        run: |
          trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers
      - name: Build device regression APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Run editor and Combined finalization regressions and measure database/catalog operations
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash scripts/run_release0950_acceptance.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: acceptance-0950-emulator
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/acceptance-0950/
