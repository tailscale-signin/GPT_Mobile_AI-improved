name: Kotlin Lint Check

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".github/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"

concurrency:
  group: ktlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: Check Kotlin Code Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run ktlint
        uses: ScaCap/action-ktlint@fc3c592ee82e12540946363cc0a0ef165a9aae5f
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ktlint_version: 1.3.1
          filter_mode: added
          reporter: github-pr-review
          fail_on_error: true
