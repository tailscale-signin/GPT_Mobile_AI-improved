// Explicit constrained-JVM regression gates; run only the selected heap/export test classes.
// The staged diagnostic core uses a smaller JVM without loading Robolectric's Android runtime.
def diagnosticCaptureGate = gradle.startParameter.projectProperties['gptmobile.diagnosticHeapStress'] == 'true'
def gateHeap = '256m'
def gateReport = diagnosticCaptureGate ? 'diagnosticHeapRecovery' : 'heapRecovery'
def gateIncludes = ['**/ResearchSessionStoreHeapTest.class', '**/StreamingDebugBundleTest.class', '**/BenchmarkStreamingExportHeapTest.class', '**/BenchmarkColdStreamingExportHeapTest.class']
if (diagnosticCaptureGate) {
    gateIncludes = ['**/StagedDiagnosticCaptureHeapTest.class']
}
allprojects {
    tasks.withType(Test).configureEach {
        maxHeapSize = gateHeap
        maxParallelForks = 1
        forkEvery = 1
        systemProperty 'gptmobile.heapStress', 'true'
        systemProperty 'gptmobile.diagnosticHeapStress', diagnosticCaptureGate.toString()
    }
}

// AGP assigns report defaults while realizing AndroidUnitTest tasks.
// Realize them after project evaluation before setting the gate's output paths.
gradle.projectsEvaluated {
    gradle.rootProject.allprojects { gateProject ->
        gateProject.tasks.withType(Test).each { gateTest ->
            // Reassert after AGP's normal-suite defaults, just like the report paths.
            gateTest.maxHeapSize = gateHeap
            gateTest.maxParallelForks = 1
            gateTest.forkEvery = 1
            gateTest.systemProperty 'gptmobile.heapStress', 'true'
            gateTest.systemProperty 'gptmobile.diagnosticHeapStress', diagnosticCaptureGate.toString()
            // Restrict class scanning as well as --tests filtering: otherwise
            // forkEvery=1 starts a JVM for every unrelated test class first.
            gateTest.setIncludes(gateIncludes as Set)
            gateTest.reports.junitXml.outputLocation.set(gateProject.layout.buildDirectory.dir("test-results/$gateReport"))
            gateTest.reports.html.outputLocation.set(gateProject.layout.buildDirectory.dir("reports/tests/$gateReport"))
            gateTest.binaryResultsDirectory.set(gateProject.layout.buildDirectory.dir("test-results/$gateReport/binary"))
        }
    }
}
