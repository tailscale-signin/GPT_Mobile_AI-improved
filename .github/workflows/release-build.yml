name: Generate Release Version

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - release-*

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build and Sign Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk and memory space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Configure swap space for CI stability
        run: |
          echo "Setting up 4GB swap space to prevent runner OOM during release minification and dexing..."
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Keystore
        id: setup-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using deterministic release keystore configuration"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias gptmobile \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "gptmobile-deterministic-release-key" \
              -keypass "gptmobile-deterministic-release-key" \
              -dname "CN=GPT Mobile Improved, OU=Development, O=OpenSource, L=Global, ST=Global, C=XX"
            echo "KEYSTORE_PASSWORD=gptmobile-deterministic-release-key" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=gptmobile" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=gptmobile-deterministic-release-key" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK
        id: build_release
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8"
        run: |
          echo "Building Release APK..."
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2 2>&1 | tee gradle-release-build.log

      - name: Build Release Bundle
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8"
        run: |
          echo "Building Release Bundle..."
          ./gradlew bundleRelease --stacktrace --no-daemon --max-workers=2 || echo "Bundle build skipped or non-fatal"

      - name: Sign APKs with apksigner
        run: |
          echo "Locating built APKs across app/build/outputs/:"
          find app/build/outputs/ -type f -name "*.apk" || true

          mkdir -p app/build/outputs/apk/release/signed/

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"

          shopt -s nullglob globstar
          FOUND_APKS=(app/build/outputs/**/release*/**/*.apk app/build/outputs/**/release/*.apk)
          echo "Found ${#FOUND_APKS[@]} candidate APK(s) to sign"

          if [ ${#FOUND_APKS[@]} -eq 0 ]; then
            echo "ERROR: Gradle assembleRelease finished without creating any APK files!"
            exit 1
          fi

          for apk in "${FOUND_APKS[@]}"; do
            case "$apk" in
              *"-signed.apk"*) continue ;;
              *) ;;
            esac
            echo "Signing $apk..."
            basename=$(basename "$apk")
            signed_apk="app/build/outputs/apk/release/signed/$basename"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$signed_apk" \
              "$apk"

            "$APKSIGNER" verify "$signed_apk"
          done

          if [ -f "app/build/outputs/apk/release/signed/app-universal-release.apk" ]; then
            cp -f "app/build/outputs/apk/release/signed/app-universal-release.apk" app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/release/signed/app-arm64-v8a-release.apk" ]; then
            cp -f "app/build/outputs/apk/release/signed/app-arm64-v8a-release.apk" app/build/outputs/apk/release/app-release.apk
          fi

          echo "Successfully signed APKs in app/build/outputs/apk/release/signed/:"
          ls -la app/build/outputs/apk/release/signed/ || true

      - name: Sign AAB with jarsigner
        run: |
          echo "Locating built AAB in app/build/outputs/bundle/release/:"
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || true

          RAW_AAB=$(find app/build/outputs/ -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$RAW_AAB" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$RAW_AAB" \
              "$KEY_ALIAS"
            mkdir -p app/build/outputs/bundle/release/
            cp -f "$RAW_AAB" app/build/outputs/bundle/release/app-release.aab
            echo "Successfully signed AAB."
          else
            echo "No AAB found to sign, skipping AAB signing."
          fi

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-release-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/signed/*.apk
            app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gpt-mobile-release-bundle-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${VERSION_NAME}-pre.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION_NAME (code: $VERSION_CODE, sha: $SHORT_SHA)"

      - name: Publish or Update GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version_info.outputs.tag_name }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
          SHORT_SHA: ${{ steps.version_info.outputs.short_sha }}
        run: |
          echo "Publishing GitHub Pre-release for tag: $TAG_NAME"

          shopt -s nullglob globstar
          ASSETS_TO_UPLOAD=()
          for signed in app/build/outputs/apk/release/signed/*.apk; do
            if [ -f "$signed" ]; then
              ASSETS_TO_UPLOAD+=("$signed")
            fi
          done

          if [ ${#ASSETS_TO_UPLOAD[@]} -eq 0 ]; then
            echo "Signed release directory had no apks, searching all build outputs..."
            for any_apk in app/build/outputs/**/*.apk; do
              if [ -f "$any_apk" ]; then
                ASSETS_TO_UPLOAD+=("$any_apk")
              fi
            done
          fi

          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            ASSETS_TO_UPLOAD+=("app/build/outputs/bundle/release/app-release.aab")
          fi

          if [ ${#ASSETS_TO_UPLOAD[@]} -eq 0 ]; then
            echo "ERROR: No release assets found to upload to GitHub Release!"
            exit 1
          fi

          echo "Found ${#ASSETS_TO_UPLOAD[@]} asset(s) to publish: ${ASSETS_TO_UPLOAD[*]}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading/overwriting release assets..."
            gh release upload "$TAG_NAME" "${ASSETS_TO_UPLOAD[@]}" --clobber
          else
            echo "Creating fresh GitHub Pre-Release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              "${ASSETS_TO_UPLOAD[@]}" \
              --prerelease \
              --title "v${VERSION_NAME} (Build ${SHORT_SHA})" \
              --notes "Automated pre-release build for commit ${SHORT_SHA} on main branch. Includes signed APKs (universal and ABI-specific) built with R8 optimization."
          fi
          echo "GitHub Pre-Release $TAG_NAME published successfully."

      - name: Report Build Failure as GitHub Issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          ERROR_SNIPPET="No build log captured"
          if [ -f gradle-release-build.log ]; then
            ERROR_SNIPPET=$(grep -E -A 10 -B 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:)" gradle-release-build.log | tail -n 60 || true)
            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET=$(tail -n 60 gradle-release-build.log)
            fi
          fi

          SHORT_COMMIT=$(echo "$COMMIT_SHA" | cut -c1-7)
          ISSUE_TITLE="Release Build Failure on $REF_NAME ($SHORT_COMMIT)"

          BODY_FILE=$(mktemp)
          {
            echo "### 🚨 Automated CI Build Failure Report"
            echo ""
            echo "**Workflow:** $WORKFLOW_NAME"
            echo "**Branch / Ref:** \`$REF_NAME\`"
            echo "**Commit:** \`$COMMIT_SHA\`"
            echo "**Run Details:** [View Actions Run]($RUN_URL)"
            echo ""
            echo "---"
            echo ""
            echo "### Exact Build Error / Failure Log (For AI & Maintainers)"
            echo "\`\`\`text"
            echo "$ERROR_SNIPPET"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "*Generated automatically by CI workflow.*"
          } > "$BODY_FILE"

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for this build failure."
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE" || true
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label "build-failure" \
              --body-file "$BODY_FILE" || echo "Unable to create issue (issues might be disabled for this repository)"
          fi
          rm -f "$BODY_FILE"
