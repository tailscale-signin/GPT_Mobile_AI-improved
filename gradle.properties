# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM memory ceiling and worker settings for CI/CD runners (GitHub Actions runners provide 7GB RAM + swap)
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false

# AndroidX package structure
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false

# Allow KSP and Kotlin compiler to isolate memory appropriately
ksp.run.in.process=true
ksp.use.classpath.args=true
kotlin.compiler.execution.strategy=in-process
