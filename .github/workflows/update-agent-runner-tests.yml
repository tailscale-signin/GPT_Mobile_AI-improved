name: Update AgentRunner limit tests

on:
  push:
    branches: [main]
    paths: [.github/workflows/update-agent-runner-tests.yml]

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update tests
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/agent/AgentRunnerTest.kt")
          text = path.read_text()
          marker = "val events = AgentRunner().run(session, listOf(tool)).toList()\n\n        assertEquals(4, maxActive.get())"
          replacement = "val events = AgentRunner(\n            limits = AgentRunLimits(maxConcurrentTools = 4)\n        ).run(session, listOf(tool)).toList()\n\n        assertEquals(4, maxActive.get())"
          if marker not in text:
              raise SystemExit("Concurrency test marker not found")
          text = text.replace(marker, replacement, 1)

          pattern = r'''    @Test\n    fun `tool call ceiling stops before any excess call executes`\(\) = runBlocking \{.*?\n    \}\n\n    @Test\n    fun `round ceiling stops repeated tool loops`'''
          replacement_test = '''    @Test
    fun `tool call ceiling executes available calls and finalizes gracefully`() = runBlocking {
        val executions = AtomicInteger()
        val providerCalls = AtomicInteger()
        val exposedToolCounts = mutableListOf<Int>()
        val session = session { tools, exchanges ->
            exposedToolCounts += tools.size
            when (providerCalls.getAndIncrement()) {
                0 -> flow {
                    repeat(11) { emit(toolCall("call_$it")) }
                    emit(ProviderEvent.Completed)
                }
                else -> flow {
                    assertEquals(11, exchanges.single().results.size)
                    emit(ProviderEvent.TextDelta("final"))
                    emit(ProviderEvent.Completed)
                }
            }
        }
        val tool = tool { callId, _ ->
            executions.incrementAndGet()
            AgentToolResult(callId, ToolResultContent.Text("ok"), isError = false)
        }

        val events = AgentRunner().run(session, listOf(tool)).toList()

        assertEquals(11, executions.get())
        assertEquals(listOf(1, 0), exposedToolCounts)
        assertTrue(events.any { it is AgentRunEvent.Notice })
        assertFalse(events.any { it is AgentRunEvent.Provider && it.event is ProviderEvent.Failed })
        assertEquals(AgentRunEvent.Provider(ProviderEvent.Completed), events.last())
    }

    @Test
    fun `round ceiling stops repeated tool loops`'''
          text, count = re.subn(pattern, replacement_test, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Legacy ceiling test not found")
          path.write_text(text)
          Path(".github/workflows/update-agent-runner-tests.yml").unlink()
      - name: Commit updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/test/kotlin/dev/chungjungsoo/gptmobile/data/agent/AgentRunnerTest.kt .github/workflows/update-agent-runner-tests.yml
          git commit -m "Update agent limit tests for graceful finalization"
          git push
