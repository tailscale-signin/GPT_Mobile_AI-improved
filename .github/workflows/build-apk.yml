name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee gradle-debug-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error title=Debug Build Failed::$(grep -E '^(e:|error:|FAILURE:|Caused by:)' gradle-debug-build.log | head -n 5 | tr '\n' ' ')"
            echo "=== GRADLE FAILURE TAIL ==="
            tail -n 120 gradle-debug-build.log
            exit 1
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Release APK
        id: build_release
        run: |
          ./gradlew assembleRelease --no-daemon --info 2>&1 | tee gradle-release-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning title=Release Build Failed::$(grep -E '^(e:|error:|FAILURE:|Caused by:)' gradle-release-build.log | head -n 5 | tr '\n' ' ')"
            echo "=== RELEASE BUILD FAILURE LOG ==="
            tail -n 120 gradle-release-build.log
          fi
        continue-on-error: true

      - name: Upload Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.build_release.outcome == 'success'
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            gradle-debug-build.log
            gradle-release-build.log
          if-no-files-found: ignore

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - Debug build of GPT Mobile AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
