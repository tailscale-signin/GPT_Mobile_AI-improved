name: Speech engine model smoke

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkpoint:
    name: Real ${{ matrix.engine }} checkpoint on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, phonon, pocket]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install published runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgles2 libegl1 libgl1 libglib2.0-0t64 libportaudio2
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-voice-mediapipe-smoke.txt
      - name: Execute the pinned checkpoint through the real SDK
        shell: bash
        env:
          SPEECH_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/smoke_mediapipe_speech.py \
            --engine "$SPEECH_ENGINE" \
            --output "artifacts/mediapipe-$SPEECH_ENGINE.json" \
            --model-dir "$RUNNER_TEMP/mediapipe-$SPEECH_ENGINE" \
            --timeout 300 2>&1 | tee "artifacts/mediapipe-$SPEECH_ENGINE.log"
      - name: Retain exact-source model and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speech-checkpoint-${{ matrix.engine }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
