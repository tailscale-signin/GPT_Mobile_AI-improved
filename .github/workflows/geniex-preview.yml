name: GenieX preview validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gradle_retry.py'
      - 'scripts/provision_robolectric_sdks.py'
      - 'scripts/tests/test_gradle_retry.py'
      - 'scripts/artifact_manifest.py'
      - 'scripts/tests/test_delivery_pipeline.py'
      - 'scripts/sign_preview_apks.py'
      - 'scripts/tests/test_sign_preview_apks.py'
      - 'app/src/geniex/**'
      - 'app/src/litertOnly/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localmodel/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'scripts/check_local_runtime_apk.py'
      - 'docs/audits/geniex-preview-native-libraries.json'
      - '.github/workflows/geniex-preview.yml'

permissions:
  contents: read

concurrency:
  group: geniex-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: "true"
  ISSUE_REPORT_ORIGIN: ${{ vars.ISSUE_REPORT_ORIGIN }}
  ISSUE_REPORT_GITHUB_ENABLED: ${{ vars.ISSUE_REPORT_GITHUB_ENABLED || 'true' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    # Independent compile/test/package stages, plus setup and artifact audits.
    # The arm64 GenieX QAIRT package includes a large libQnnHtpPrepare payload;
    # keep the job bounded while allowing cold-run ApkFlinger packaging to finish.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Select the preview signing directory
        run: |
          mkdir -p "$RUNNER_TEMP/geniex-android-user"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/geniex-android-user" >> "$GITHUB_ENV"
      - name: Restore verified Robolectric runtime cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-sha512-linux-${{ hashFiles('scripts/provision_robolectric_sdks.py') }}

      - name: Provision verified Robolectric runtimes
        timeout-minutes: 10
        run: python3 scripts/provision_robolectric_sdks.py

      - name: Provision verified memory model outside Gradle
        run: python3 scripts/provision_memory_model.py
      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh
      # Release KSP processor state before the separate compilation process.
      - name: Generate isolated preview sources in a separate process
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-source-generation --output build/geniex-validation/source-generation-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 540 -- -PgeniexRuntime=true :app:kspDebugKotlin --no-daemon --max-workers=1 --console=plain --stacktrace --profile 2>&1 | tee build/geniex-validation/source-generation.log
      # KAPT retains its own compiler and processor state; release it before compilation.
      # Run 43684891677 exhausted the 3 GiB heap during KAPT stub generation.
      # Match the bounded 4 GiB annotation process used by PR validation.
      - name: Process isolated preview annotations in a separate process
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-annotation-processing --output build/geniex-validation/annotation-processing-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 540 -- -PgeniexRuntime=true :app:kaptDebugKotlin --no-daemon --max-workers=1 --console=plain --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/annotation-processing.log
      # Keep the production compiler in its own bounded process before unit compilation.
      - name: Compile isolated preview production sources
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/check_android_compile_memory.py | tee build/geniex-validation/production-memory.log
          python3 scripts/build_metrics.py --label geniex-production-compile --output build/geniex-validation/production-compile-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 1140 -- -PgeniexRuntime=true :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --max-workers=1 --console=plain --stacktrace --profile "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8 -Xlog:gc:file=${RUNNER_TEMP}/geniex-production-gc.log:time,level,tags:filecount=2,filesize=8M" 2>&1 | tee build/geniex-validation/production-compile.log
      # Release production compiler state before the existing 4 GiB unit compiler.
      - name: Compile isolated preview unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-unit-compile --output build/geniex-validation/unit-compile-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac --no-daemon --max-workers=1 --console=plain --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/unit-compile.log
      - name: Run isolated preview unit tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-unit-tests --output build/geniex-validation/unit-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true :app:validateSigningDebug :app:testDebugUnitTest --no-daemon --console=plain --stacktrace --profile 2>&1 | tee build/geniex-validation/unit.log
      - name: Save GenieX unit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 14
          name: geniex-unit-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      # Keep ApkFlinger compression and debug signing in separate processes for both previews.
      - name: Build isolated preview APK
        timeout-minutes: 50
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          python3 scripts/build_metrics.py --label geniex-debug --output build/geniex-validation/debug-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 2820 -- -PgeniexRuntime=true -PgeniexSeparateSigning=true :app:assembleDebug --no-daemon --max-workers=1 --console=plain --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/debug.log
      - name: Sign and verify debug GenieX preview APKs
        timeout-minutes: 15
        run: python3 scripts/sign_preview_apks.py app/build/outputs/apk/debug --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --keystore "$ANDROID_USER_HOME/debug.keystore"
      - name: Compile minified GenieX production sources
        timeout-minutes: 55
        run: python3 scripts/android_pipeline.py --runtime geniex --variant nativeSmoke --phase compile --output build/geniex-validation/native-compile.json
      - name: Validate release shrinker for the GenieX runtime
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          # Match native-memory-smoke.yml: release compiler/KSP/R8 analysis
          # memory before ApkFlinger allocates its packaging buffers.
          python3 scripts/build_metrics.py --label geniex-shrinker --output build/geniex-validation/shrinker-metrics.json -- python3 scripts/gradle_retry.py -- -PgeniexRuntime=true -PnativeMemorySmoke=true :app:minifyNativeSmokeWithR8 --no-daemon --max-workers=1 --console=plain --info --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/shrinker.log
      # Run 41252265770 captured signing waiting on the common pool while its
      # compression workers waited on the archive lock held by the signer.
      # Separate signing from packaging; never publish an unverified signature.
      # The same capture used 3.64 GiB of the 4 GiB heap, so only this fresh
      # packaging process gets a measured 6 GiB bound on the 16 GiB runner.
      - name: Package the minified GenieX APK in a fresh process
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/geniex-validation
          (
            sleep 900
            diagnostics=build/geniex-validation/package-watchdog.log
            {
              echo "GenieX packaging is still active after 15 minutes."
              date -u '+captured_at=%Y-%m-%dT%H:%M:%SZ'
              ps -eo pid=,ppid=,stat=,etime=,%cpu=,%mem=,rss=,comm= --sort=-%cpu | head -n 80
              while read -r pid; do
                [[ "$pid" =~ ^[0-9]+$ ]] || continue
                echo "--- Gradle daemon $pid heap ---"
                timeout 15s jcmd "$pid" GC.heap_info || true
                echo "--- Gradle daemon $pid threads ---"
                timeout 30s jcmd "$pid" Thread.print -l || true
              done < <(jcmd -l | awk '/GradleDaemon/ {print $1}' | tail -n 2)
            } > "$diagnostics" 2>&1
          ) &
          watchdog_pid=$!
          cleanup_watchdog() {
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
          }
          trap cleanup_watchdog EXIT
          python3 scripts/build_metrics.py --label geniex-package --output build/geniex-validation/package-metrics.json -- python3 scripts/gradle_retry.py --timeout-seconds 5160 -- -PgeniexRuntime=true -PnativeMemorySmoke=true -PgeniexSeparateSigning=true :app:assembleNativeSmoke --no-daemon --max-workers=1 --console=plain --info --stacktrace --profile '-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -XX:+UseG1GC -Dfile.encoding=UTF-8' 2>&1 | tee build/geniex-validation/package.log
      - name: Sign and verify minified GenieX preview APKs
        timeout-minutes: 15
        run: |
          python3 scripts/sign_preview_apks.py app/build/outputs/apk/nativeSmoke --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" --keystore "$ANDROID_USER_HOME/debug.keystore"
      - name: Audit minified GenieX native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/nativeSmoke/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/nativeSmoke/*.apk
      - name: Audit resolved Maven AAR
        run: python3 scripts/audit_geniex_aar.py --output app/build/reports/geniex-maven-artifact.json
      - name: Audit packaged native stack
        run: |
          python3 scripts/check_local_runtime_apk.py --native-stack geniex app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk
      - name: Index versioned GenieX candidates
        run: python3 scripts/artifact_manifest.py --root app/build/outputs/apk --runtime geniex --output build/geniex-validation/artifact-index.json
      - name: Verify GenieX candidate index
        run: python3 scripts/artifact_manifest.py --verify --root app/build/outputs/apk --runtime geniex --output build/geniex-validation/artifact-index.json --require 'debug/*.apk' --require 'nativeSmoke/*.apk'
      - name: Save GenieX validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 30
          name: geniex-validation-diagnostics
          path: |
            build/geniex-validation/
            ${{ runner.temp }}/geniex-production-gc.log*
            build/reports/profile/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: geniex-preview-debug
          path: |
            build/geniex-validation/artifact-index.json
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/nativeSmoke/*.apk
            app/build/reports/geniex-maven-artifact.json
          if-no-files-found: error
