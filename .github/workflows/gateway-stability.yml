name: Gateway stability
on:
  pull_request:
    paths: ['gateway/**', 'authentication/**', '.github/workflows/gateway-stability.yml']
  push:
    branches: ['main', 'feat/gateway-v14-1-stability-2026-10-10', 'feat/combined-marketplace-gateway-14-2-2026-10-10']
    paths:
      - 'gateway/**'
      - 'authentication/**'
      - '.github/workflows/gateway-stability.yml'
      - 'app/build.gradle.kts'
      - 'release-scope.json'
      # Publication-only changes must still earn an exact-main Gateway receipt.
      - '.github/workflows/recover-verified-android144-gateway18.yml'
      - 'scripts/recover_release_publication.py'
      - 'scripts/verify_published_release.py'
      - 'release-recovery.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gateway:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    # Windows FULL-sync journal tests can use most of the old 15-minute job budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r gateway/requirements.txt
      - run: python gateway/gateway.py validate-config
      - run: python gateway/check_gateway.py
      - run: python -m unittest discover -s authentication -t . -p 'test_*.py' -v

  managed-validation:
    name: Managed repository validation (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Gateway host validation dependencies
        run: python -m pip install --require-hashes -r gateway/requirements.txt -r scripts/requirements-ci.txt
      - name: Execute every Kotlin, SQLite and workflow benchmark control
        timeout-minutes: 8
        run: python scripts/run_benchmark_native_controls.py
      - name: Verify managed defaults against the exact checkout in an offline container
        run: python gateway/tests/repository_validation_smoke.py --report build/reports/managed-validation.json
      - name: Retain exact-source validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-validation-${{ github.sha }}
          path: |
            build/reports/managed-validation.json
            build/benchmark-native-controls/native-controls.txt
          if-no-files-found: warn
          retention-days: 14
