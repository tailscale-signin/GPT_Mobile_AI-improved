name: Research Assist Workbench

on:
  push:
    branches: [fix/research-local-assist-pipeline-2026-10-13]
    paths: [.repair-workbench/ready.json]

permissions:
  contents: read

concurrency:
  group: research-assist-workbench
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/research-local-assist-pipeline-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/research-local-assist-pipeline-2026-10-13
      - name: Verify and apply exact source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.repair-workbench/ready.json').read_text())
          encoded = ''.join((root / ('.repair-workbench/' + name)).read_text().strip() for name in manifest['parts'])
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) < 2_000_000
          assert hashlib.sha256(raw).hexdigest() == manifest['sha256'], 'Edit payload digest mismatch'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          writes = []
          for edit in json.loads(raw):
              relative = pathlib.PurePosixPath(edit['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert str(relative).startswith(('app/', 'docs/implementation/', '.github/workflows/'))
              path = root / relative
              assert not path.is_symlink()
              before = path.read_bytes() if path.exists() else b''
              assert (blob(before) if path.exists() else None) == edit['before'], 'Source changed: ' + str(relative)
              lines = before.decode().splitlines(keepends=True)
              for start, count, inserted in reversed(edit['ops']):
                  assert 0 <= start <= start + count <= len(lines)
                  lines[start:start + count] = inserted.splitlines(keepends=True)
              after = ''.join(lines).encode()
              assert blob(after) == edit['after'], 'Result digest mismatch: ' + str(relative)
              writes.append((path, after))
          for path, data in writes:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Applied', len(writes), 'source files after validating every original and resulting blob.')
          PY
          git add app docs/implementation .github/workflows
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Format changed Kotlin and commit only this repair branch
        id: commit
        shell: bash
        run: |
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.3.1/ktlint-cli-1.3.1-all.jar -o /tmp/ktlint.jar
          mapfile -d '' files < <(git diff --cached --name-only -z -- '*.kt' '*.kts')
          set +e
          java -jar /tmp/ktlint.jar -F "${files[@]}"
          format_status=$?
          set -e
          git add app docs/implementation .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore reviewed Research, local assistance, safe recovery and traceable handoffs'
          git push origin HEAD:refs/heads/fix/research-local-assist-pipeline-2026-10-13
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit "$format_status"
      - name: Export actual source for inspection
        if: always()
        run: git archive --format=tar.gz --output=research-assist-worktree.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-assist-worktree
          path: research-assist-worktree.tar.gz
          retention-days: 1

  validate:
    needs: apply
    if: always() && needs.apply.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OBX_DISABLE_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Contracts and resource preflight
        run: |
          python3 scripts/check_android_regex.py
          python3 scripts/check_unified_reliability_v2.py
          python3 -m unittest discover -s scripts/tests
          bash scripts/validate.sh resources
      - name: Android unit tests and lint on the applied commit
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon 2>&1 | tee test.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-assist-validation
          path: |
            test.log
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          retention-days: 1
