name: Diagnostic audit validation

on:
  push:
    branches: [fix/diagnostic-audit-reliability-2026-10-11]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/audit-workspace.yml'
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'scripts/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/audit-workspace.yml'

permissions:
  contents: read

concurrency:
  group: diagnostic-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OBX_DISABLE_ANALYTICS: 'true'
  ISSUE_REPORT_ORIGIN: ${{ vars.ISSUE_REPORT_ORIGIN }}
  ISSUE_REPORT_GITHUB_ENABLED: ${{ vars.ISSUE_REPORT_GITHUB_ENABLED || 'true' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Resource, whitespace and changed-source formatting checks
        shell: bash
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || '63bfbebde4c1ce1b74890a91c20517ae2dd4cc19' }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$CHANGE_BASE" HEAD)
          git diff --check "$base" HEAD
          bash scripts/validate.sh resources
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- 'app/src/**/*.kt')
          if ((${#files[@]})); then java -jar "$RUNNER_TEMP/ktlint" "${files[@]}"; fi

  android:
    runs-on: ubuntu-latest
    # Bound cold compilation separately and reserve time for lint and reports.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Provision verified memory model outside Gradle
        run: python3 scripts/provision_memory_model.py
      - name: Install Vulkan shader headers for Android GGUF backend
        timeout-minutes: 8
        run: bash scripts/install_android_native_dependencies.sh
      - name: Provision verified Robolectric runtimes
        timeout-minutes: 10
        run: python3 scripts/provision_robolectric_sdks.py
      # Run 42164047441 exhausted the 3 GiB compile heap. Release KSP/KAPT
      # before the bounded 4 GiB production compile, then release compiler state
      # before compiling and running tests with the unchanged default bounds.
      - name: Generate production sources in a separate process
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          python3 scripts/gradle_retry.py --timeout-seconds 540 -- :app:kspDebugKotlin :app:kaptDebugKotlin --no-daemon --max-workers=1 --console=plain 2>&1 | tee audit-ksp.log
      - name: Compile production sources in a separate process
        timeout-minutes: 20
        id: production_compile
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 1140 -- :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --max-workers=1 --console=plain '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee audit-production-compile.log
      - name: Compile unit tests in a separate process
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/gradle_retry.py --timeout-seconds 1140 -- :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac --no-daemon --max-workers=1 --console=plain 2>&1 | tee audit-unit-compile.log
      - name: Android unit tests
        timeout-minutes: 30
        id: tests
        shell: bash
        run: |
          set -o pipefail
          echo "Tested source: $(git rev-parse HEAD)" | tee audit-unit.log
          chmod +x gradlew
          python3 scripts/gradle_retry.py -- --no-daemon --max-workers=1 --stacktrace :app:testDebugUnitTest 2>&1 | tee -a audit-unit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-unit-results-${{ github.run_attempt }}
          path: |
            audit-ksp.log
            audit-production-compile.log
            audit-unit-compile.log
            audit-unit.log
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 7
      - name: Debug APK build
        timeout-minutes: 20
        id: apk
        if: ${{ !cancelled() && steps.production_compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          # Run 43165575025 exhausted the 3 GiB heap in Zipflinger compression.
          # The same source tree packaged successfully in UI Review APK with 4 GiB.
          # Retain the bounded common pool, deadline and pre-termination diagnostics.
          (
            sleep 900 &
            timer_pid=$!
            trap 'kill "$timer_pid" 2>/dev/null || true' EXIT
            wait "$timer_pid" || exit 0
            {
              date -u '+captured_at=%Y-%m-%dT%H:%M:%SZ'
              ps -eo pid=,ppid=,stat=,etime=,%cpu=,%mem=,rss=,comm= --sort=-%cpu | head -n 80 || true
              while read -r pid; do
                [[ "$pid" =~ ^[0-9]+$ ]] || continue
                echo "Gradle daemon $pid heap"
                timeout 15s jcmd "$pid" GC.heap_info || true
                echo "Gradle daemon $pid threads"
                timeout 30s jcmd "$pid" Thread.print -l || true
              done < <(jcmd -l | awk '/GradleDaemon/ {print $1}' | tail -n 2)
            } > audit-apk-watchdog.log 2>&1
          ) &
          watchdog_pid=$!
          cleanup_watchdog() {
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
          }
          trap cleanup_watchdog EXIT
          python3 scripts/gradle_retry.py --timeout-seconds 1140 -- --no-daemon --max-workers=1 --stacktrace :app:assembleDebug '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8' 2>&1 | tee audit-apk.log
      - name: Android lint
        timeout-minutes: 35
        if: ${{ !cancelled() && steps.production_compile.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          python3 scripts/gradle_retry.py -- --no-daemon --stacktrace :app:lintDebug 2>&1 | tee audit-lint.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-android-results-${{ github.run_attempt }}
          path: |
            audit-*.log
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: diagnostic-audit-debug-apk-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
