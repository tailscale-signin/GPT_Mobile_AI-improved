# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Single JVM process execution to stay strictly within GitHub runner's 7GB memory ceiling
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false

# AndroidX package structure
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# Run KSP in-process inside Gradle's 4GB JVM to avoid spawning isolated worker processes
ksp.run.in.process=true
ksp.use.classpath.args=true
