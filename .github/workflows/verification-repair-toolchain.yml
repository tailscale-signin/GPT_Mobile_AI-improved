name: Verification repair toolchain
on:
  push:
    branches: [fix/github-verification-recovery-2026-11-06]
    paths: ['.github/workflows/verification-repair-toolchain.yml']
permissions:
  contents: read
concurrency:
  group: verification-repair-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch artifacts already pinned by dependency verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, xml.etree.ElementTree as ET
          dependencies = [
              ('org.jetbrains.kotlin', 'kotlin-compiler-embeddable', '2.4.20'),
              ('org.jetbrains.kotlin', 'kotlin-daemon-embeddable', '2.4.20'),
              ('org.jetbrains.kotlin', 'kotlin-script-runtime', '2.4.20'),
              ('org.jetbrains.kotlin', 'kotlin-stdlib', '2.4.20'),
              ('org.jetbrains.kotlin', 'kotlin-reflect', '1.6.10'),
              ('org.jetbrains', 'annotations', '13.0'),
              ('org.jetbrains.kotlinx', 'kotlinx-coroutines-core-jvm', '1.11.0'),
              ('org.jetbrains.kotlinx', 'kotlinx-coroutines-test-jvm', '1.11.0'),
              ('org.jetbrains.kotlinx', 'kotlinx-serialization-core-jvm', '1.11.0'),
              ('org.jetbrains.kotlinx', 'kotlinx-serialization-json-jvm', '1.11.0'),
              ('junit', 'junit', '4.13.2'),
              ('org.hamcrest', 'hamcrest-core', '1.3'),
          ]
          root = ET.parse('gradle/verification-metadata.xml').getroot()
          components = [x for x in root.iter() if x.tag.rsplit('}', 1)[-1] == 'component']
          out = pathlib.Path('verified-toolchain'); out.mkdir()
          lines = []
          for group, name, version in dependencies:
              filename = f'{name}-{version}.jar'
              component = next(x for x in components if x.get('group') == group and x.get('name') == name and x.get('version') == version)
              artifact = next(x for x in component if x.get('name') == filename)
              accepted = {x.get('value') for x in artifact if x.tag.rsplit('}', 1)[-1] == 'sha256'}
              assert accepted, filename
              url = f'https://repo.maven.apache.org/maven2/{group.replace(chr(46), chr(47))}/{name}/{version}/{filename}'
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read(100 * 1024 * 1024)
                  assert not response.read(1), 'artifact too large'
              digest = hashlib.sha256(data).hexdigest()
              assert digest in accepted, f'Unverified artifact: {filename}'
              (out / filename).write_bytes(data)
              lines.append(f'{digest}  {filename}')
          (out / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY
      - name: Fetch repository-pinned formatter version
        run: curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o verified-toolchain/ktlint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-repair-toolchain
          path: verified-toolchain/
          retention-days: 1
          if-no-files-found: error
