name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "docs/**/*.md"
      - "LICENSE"
  pull_request:
    branches: [ "main", "feat/unified-reliability-v2-2026-10-13" ]
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: java-kotlin
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: "temurin"
        java-version: "21"

    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        validate-wrappers: true
    - name: Setup Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: "platforms;android-37.0 build-tools;37.0.0"

    - name: Accept Android licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Install Vulkan build prerequisites
      timeout-minutes: 8
      run: |
        trap 'echo "::error::Android native dependency installation failed or timed out. Retry after checking the Ubuntu package mirror and dpkg lock."' ERR
        apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
        sudo timeout --kill-after=15s 180s apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=15s 180s apt-get "${apt_options[@]}" install --no-install-recommends -y glslc libvulkan-dev spirv-headers

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - if: matrix.build-mode == 'manual'
      name: Build for CodeQL
      env:
        GRADLE_OPTS: "-Dorg.gradle.caching=false -Dkotlin.incremental=false -Dkotlin.compiler.execution.strategy=in-process"
      run: |
        python3 scripts/gradle_retry.py -- :app:clean :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8" \
          --no-daemon --no-build-cache --rerun-tasks --stacktrace --info

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        category: "/language:${{matrix.language}}"
        output: results

    - name: Upload CodeQL analysis report
      if: always()
      timeout-minutes: 5
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codeql-report-${{ matrix.language }}
        path: results/*.sarif
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload dependency verification failures
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: codeql-dependency-verification
        path: '**/build/reports/dependency-verification/'
        if-no-files-found: ignore
        retention-days: 7
