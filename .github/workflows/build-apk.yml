name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space and free disk memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          # GitHub Actions ubuntu runners often have an active swapfile at /swapfile or /mnt/swapfile.
          # Disable any active swapfile before modifying or create a dedicated new swap file.
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          # Also re-enable existing swap if available
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --info --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        id: build-release
        run: ./gradlew assembleRelease --no-daemon --info --stacktrace
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.build-release.outcome == 'success'
        id: upload-release
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - `app-debug.apk`: Debug build of GPT Mobile AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
