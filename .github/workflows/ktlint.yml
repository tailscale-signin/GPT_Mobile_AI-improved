name: Kotlin Lint Check

on:
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE"
      - ".idea/**"
      - ".github/**"
      - ".editorconfig"
      - "images/**"
      - "metadata/**"

concurrency:
  group: ktlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: Check Kotlin Code Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ktlint
        uses: ScaCap/action-ktlint@fc3c592ee82e12540946363cc0a0ef165a9aae5f
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ktlint_version: 1.3.1
          filter_mode: added
          reporter: github-pr-review
          fail_on_error: true
