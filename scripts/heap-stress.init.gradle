// Explicit constrained-JVM regression gate; run only the heap/export test classes.
allprojects {
    tasks.withType(Test).configureEach {
        maxHeapSize = '256m'
        maxParallelForks = 1
        forkEvery = 1
        systemProperty 'gptmobile.heapStress', 'true'
    }
}

// AGP assigns report defaults while realizing AndroidUnitTest tasks.
// Realize them after project evaluation before setting the gate's output paths.
gradle.projectsEvaluated {
    gradle.rootProject.allprojects { gateProject ->
        gateProject.tasks.withType(Test).each { gateTest ->
            // Reassert after AGP's normal-suite defaults, just like the report paths.
            gateTest.maxHeapSize = '256m'
            gateTest.maxParallelForks = 1
            gateTest.forkEvery = 1
            gateTest.systemProperty 'gptmobile.heapStress', 'true'
            // Restrict class scanning as well as --tests filtering: otherwise
            // forkEvery=1 starts a JVM for every unrelated test class first.
            gateTest.setIncludes(['**/ResearchSessionStoreHeapTest.class', '**/StreamingDebugBundleTest.class', '**/BenchmarkStreamingExportHeapTest.class', '**/BenchmarkColdStreamingExportHeapTest.class'] as Set)
            gateTest.reports.junitXml.outputLocation.set(gateProject.layout.buildDirectory.dir('test-results/heapRecovery'))
            gateTest.reports.html.outputLocation.set(gateProject.layout.buildDirectory.dir('reports/tests/heapRecovery'))
            gateTest.binaryResultsDirectory.set(gateProject.layout.buildDirectory.dir('test-results/heapRecovery/binary'))
        }
    }
}
