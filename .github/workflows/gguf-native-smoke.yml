name: GGUF CPU native smoke
on:
  pull_request:
    branches: [main, feat/unified-reliability-v2-2026-10-13]
    paths:
      - 'local-gguf-runtime/**'
      - 'app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/localruntime/**'
      - 'scripts/prepare_gguf_smoke.py'
      - '.github/workflows/gguf-native-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gguf-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch immutable source and fixture
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/620d2225cc436ab0b001e3200e590e3b286ef9ab -o /tmp/llama.tar.gz
          echo '1d4a987d9bd048f6e93107e838026438df70fbde237fc0c69c63d600512b4bd9  /tmp/llama.tar.gz' | sha256sum --check
          mkdir -p /tmp/llama
          tar -xf /tmp/llama.tar.gz --strip-components=1 -C /tmp/llama
          python3 -m pip install numpy tqdm pyyaml
          python3 scripts/prepare_gguf_smoke.py /tmp/llama /tmp/gguf-fixture
      - name: Compile and run production JNI with real inference
        run: |
          cmake -S local-gguf-runtime/src/main/cpp -B /tmp/gguf-build -DFETCHCONTENT_SOURCE_DIR_LLAMA=/tmp/llama -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build /tmp/gguf-build --target gptmobile_gguf gguf_chat_template_test -j2
          python3 scripts/check_gguf_compile_flags.py /tmp/gguf-build/compile_commands.json
          ctest --test-dir /tmp/gguf-build --output-on-failure
          javac -d /tmp/gguf-classes local-gguf-runtime/src/main/java/dev/melo/gguf/*.java local-gguf-runtime/src/testHost/GgufNativeSmoke.java
          java -Djava.library.path=/tmp/gguf-build -cp /tmp/gguf-classes GgufNativeSmoke /tmp/gguf-fixture/stories15M-chatml.gguf
          java -Djava.library.path=/tmp/gguf-build -cp /tmp/gguf-classes GgufNativeSmoke /tmp/gguf-fixture/stories15M-jinja.gguf
      - name: Verify optimized Android ARM64 CPU and OpenCL targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
          cmake -S local-gguf-runtime/src/main/cpp -B /tmp/gguf-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DANDROID_STL=c++_static \
            -DGGUF_OPENCL=ON \
            -DFETCHCONTENT_SOURCE_DIR_LLAMA=/tmp/llama -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          python3 scripts/check_gguf_compile_flags.py /tmp/gguf-arm64/compile_commands.json
          cmake --build /tmp/gguf-arm64 --target gptmobile_gguf -j2
