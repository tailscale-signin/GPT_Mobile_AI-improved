name: Integrate MCP server picker

on:
  push:
    paths:
      - .github/workflows/integrate-mcp-picker.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire the redesigned picker into model settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/setting/PlatformSettingScreen.kt')
          source = path.read_text()
          old_call = '                McpToolsDialog(toolBindingState, settingViewModel)'
          new_call = '                FancyMcpToolsDialog(toolBindingState, settingViewModel)'
          old_declaration = 'private fun McpToolsDialog('
          legacy_declaration = 'private fun LegacyMcpToolsDialog('
          if old_call not in source:
              raise SystemExit('MCP dialog invocation was not found')
          if old_declaration not in source:
              raise SystemExit('Legacy MCP dialog declaration was not found')
          source = source.replace(old_call, new_call, 1)
          source = source.replace(old_declaration, legacy_declaration, 1)
          path.write_text(source)
          Path('.github/workflows/integrate-mcp-picker.yml').unlink()
          PY
      - name: Commit integration and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate redesigned MCP picker into model settings"
          git push
