name: Diagnostic audit source finalization

on:
  push:
    branches: [fix/diagnostic-audit-reliability-2026-10-11]
    paths: [.github/workflows/audit-workspace.yml]

permissions:
  contents: read

jobs:
  finalize:
    if: github.ref == 'refs/heads/fix/diagnostic-audit-reliability-2026-10-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and apply final render patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.audit/final-render.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6a6a296bbf9efb459b1a1d5e15fe8a527a63d7bef6fda9f48641a3d11dd6fbf6', 'Patch integrity check failed'
          target = pathlib.Path('/tmp/final-render.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Format and verify changed Kotlin source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/ktlint/ktlint/releases/download/1.3.1/ktlint -o "$RUNNER_TEMP/ktlint"
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z 63bfbebde4c1ce1b74890a91c20517ae2dd4cc19 -- 'app/src/**/*.kt')
          java -jar "$RUNNER_TEMP/ktlint" --format "${files[@]}"
          java -jar "$RUNNER_TEMP/ktlint" "${files[@]}"
      - name: Remove only one-time patch staging
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {f'.audit/phase1-{i}.b64' for i in (1,2,3)} | {f'.audit/phase2-{i}.b64' for i in (1,2,3,4)} | {'.audit/final-render.b64', '.audit/retained-workflow.yml'}
          tracked = set(subprocess.check_output(['git', 'ls-files', '.audit']).decode().splitlines())
          assert tracked == expected, 'Unexpected staging files: do not delete unrelated work'
          subprocess.run(['git', 'rm', '--', *sorted(expected)], check=True)
          PY
      - name: Commit final source only to the requested branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/diagnostic-audit-reliability-2026-10-11
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git add -- app/src
          git diff --cached --check
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize asynchronous rendering and remove one-time audit staging'
          git push origin "HEAD:refs/heads/$branch"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
