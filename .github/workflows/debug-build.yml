name: Generate Debug Version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - trigger-debug-build

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || {
            BUILD_STATUS=$?
            echo "=== EXTRACTING COMPILER ERRORS ==="
            grep -E "e: \[ksp\]|e: [^ ]+\.kt:|FAILURE:|Caused by:" gradle-build.log > extracted-errors.log || true
            if [ ! -s extracted-errors.log ]; then
              tail -n 120 gradle-build.log > extracted-errors.log
            fi
            exit $BUILD_STATUS
          }

      - name: Save errors to repository
        if: failure()
        run: |
          cp extracted-errors.log BUILD_ERRORS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BUILD_ERRORS.txt
          git commit -m "ci: record build errors [skip ci]" || true
          git push origin main || true

      - name: Report Build Failure to Issues
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERROR_CONTENT=$(head -n 80 extracted-errors.log 2>/dev/null || echo "Build failed. Check actions console.")
          gh issue create \
            --title "Build Failure: ${{ github.sha }}" \
            --body $'### Compilation / Build Failure Log\n\n```text\n'"$ERROR_CONTENT"$'\n```\n\nCommit: ${{ github.sha }}' \
            --repo "${{ github.repository }}" || true

      - name: Locate and list built APKs
        run: |
          echo "=== Built APK files ==="
          find app/build/outputs/ -type f -name "*.apk" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: gpt-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
