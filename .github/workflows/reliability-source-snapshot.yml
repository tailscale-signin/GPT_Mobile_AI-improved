name: Reliability source snapshot
on:
  push:
    branches: [fix/live-diagnostics-gateway-multisearch]
    paths: [.github/workflows/reliability-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source and test files only
        run: |
          mkdir -p /tmp/reliability-source
          git ls-files -z -- app/src/main/kotlin app/src/test gateway scripts gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts AGENTS.md .editorconfig | tar --null -T - -czf /tmp/reliability-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: reliability-source
          path: /tmp/reliability-source/source.tar.gz
          retention-days: 1
