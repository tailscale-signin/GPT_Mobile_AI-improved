name: Format and validate OpenRouter picker wiring (one-shot)

on:
  push:
    paths:
      - .github/workflows/validate-openrouter-picker.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Format wiring
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/setting/PlatformSettingScreen.kt")
          source = path.read_text()
          old = '''                    if (platformData.compatibleType == ClientType.OPENROUTER && dialogState.isApiModelDialogOpen) {
              OpenRouterModelPickerDialog(
                  currentModel = platformData.model,
                  onDismiss = settingViewModel::closeApiModelDialog,
                  onModelSelected = settingViewModel::updateApiModel
              )
          } else {
              ModelDialog(dialogState, platformData.model, settingViewModel)
          }'''
          new = '''                    if (platformData.compatibleType == ClientType.OPENROUTER && dialogState.isApiModelDialogOpen) {
                        OpenRouterModelPickerDialog(
                            currentModel = platformData.model,
                            onDismiss = settingViewModel::closeApiModelDialog,
                            onModelSelected = settingViewModel::updateApiModel
                        )
                    } else {
                        ModelDialog(dialogState, platformData.model, settingViewModel)
                    }'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected malformed wiring block exactly once, found {source.count(old)}")
          path.write_text(source.replace(old, new))
      - name: Validate Kotlin
        run: ./gradlew ktlintCheck compileDebugKotlin --no-daemon
      - name: Remove workflow and commit
        if: success()
        run: |
          rm .github/workflows/validate-openrouter-picker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format and validate OpenRouter model picker wiring"
          git push
