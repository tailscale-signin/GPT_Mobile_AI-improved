name: Refactor Chungjungsoo to Melo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run rename and consolidation
        run: |
          set -euo pipefail

          PACKAGES=("network" "catalog" "huggingface" "localmodel" "localruntime" "mcp" "parser" "worker")
          for pkg in "${PACKAGES[@]}"; do
            if [ -d "app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/$pkg" ]; then
              mkdir -p "app/src/main/kotlin/dev/melo/gptmobile/improved/data/$pkg"
              cp -rn "app/src/main/kotlin/dev/chungjungsoo/gptmobile/data/$pkg"/* "app/src/main/kotlin/dev/melo/gptmobile/improved/data/$pkg/" || true
            fi
          done

          if [ -d "app/src/main/kotlin/dev/chungjungsoo/gptmobile/util" ]; then
            mkdir -p "app/src/main/kotlin/dev/melo/gptmobile/improved/util"
            cp -rn "app/src/main/kotlin/dev/chungjungsoo/gptmobile/util"/* "app/src/main/kotlin/dev/melo/gptmobile/improved/util/" || true
          fi

          # Remove the legacy chungjungsoo tree
          rm -rf "app/src/main/kotlin/dev/chungjungsoo"

          # Rename package statements and imports across codebase
          find app/src -type f \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" \) -exec sed -i 's/dev\.chungjungsoo\.gptmobile/dev\.melo\.gptmobile\.improved/g' {} +

          # Replace any other mentions of chungjungsoo with melo across project (excluding git and workflow)
          find . -type f -not -path '*/.*' -not -path './.github/workflows/refactor-to-melo.yml' -exec grep -l "chungjungsoo" {} + | while read -r file; do
            sed -i 's/chungjungsoo/melo/g' "$file"
          done

          # Self-cleanup of this workflow file
          rm -f .github/workflows/refactor-to-melo.yml

          # Configure git and commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor!: purge all traces of chungjungsoo and consolidate into dev.melo"
            git push origin main
          fi
