name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swap Space and free disk memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          sudo swapoff -a || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          if [ -f /swapfile ]; then sudo swapon /swapfile || true; fi
          if [ -f /mnt/swapfile ]; then sudo swapon /mnt/swapfile || true; fi
          free -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | tee gradle-debug-build.log
          echo "Listing all generated APK files:"
          find app/build/outputs/ -type f -name "*.apk" || true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/**/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Build Release APK
        id: build_release
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --info --stacktrace 2>&1 | tee gradle-release-build.log
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

      - name: Upload Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.build_release.outcome == 'success'
        id: upload-release
        with:
          name: app-release-unsigned
          path: |
            app/build/outputs/apk/release/**/*.apk
            app/build/outputs/**/*.apk
          if-no-files-found: ignore

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-failure-log
          path: |
            gradle-debug-build.log
            gradle-release-build.log
          if-no-files-found: ignore

      - name: Report Build Failure as GitHub Issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          ERROR_SNIPPET="No build log captured"
          if [ -f gradle-debug-build.log ]; then
            ERROR_SNIPPET=$(grep -E -A 10 -B 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:)" gradle-debug-build.log | tail -n 60 || true)
            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET=$(tail -n 60 gradle-debug-build.log)
            fi
          elif [ -f gradle-release-build.log ]; then
            ERROR_SNIPPET=$(grep -E -A 10 -B 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:)" gradle-release-build.log | tail -n 60 || true)
            if [ -z "$ERROR_SNIPPET" ]; then
              ERROR_SNIPPET=$(tail -n 60 gradle-release-build.log)
            fi
          fi

          SHORT_COMMIT=$(echo "$COMMIT_SHA" | cut -c1-7)
          ISSUE_TITLE="CI Build Failure on $REF_NAME ($SHORT_COMMIT)"

          BODY_FILE=$(mktemp)
          {
            echo "### 🚨 Automated CI Build Failure Report"
            echo ""
            echo "**Workflow:** $WORKFLOW_NAME"
            echo "**Branch / Ref:** \`$REF_NAME\`"
            echo "**Commit:** \`$COMMIT_SHA\`"
            echo "**Run Details:** [View Actions Run]($RUN_URL)"
            echo ""
            echo "---"
            echo ""
            echo "### Exact Build Error / Failure Log (For AI & Maintainers)"
            echo "\`\`\`text"
            echo "$ERROR_SNIPPET"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "*Generated automatically by CI workflow.*"
          } > "$BODY_FILE"

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for this build failure."
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE" || true
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --label "build-failure,bug" \
              --body-file "$BODY_FILE" || echo "Unable to create issue (issues might be disabled for this repository)"
          fi
          rm -f "$BODY_FILE"

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - Debug build of GPT Mobile AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
