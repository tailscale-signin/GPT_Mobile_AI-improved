name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build_debug
        run: |
          ./gradlew assembleDebug --no-daemon --info --stacktrace 2>&1 | tee gradle-debug-build.log || {
            echo "::error title=Debug Build Failed::$(tail -n 30 gradle-debug-build.log | tr '\n' ' ')"
            exit 1
          }
          echo "Listing all generated APK files:"
          find app/build/outputs/ -type f -name "*.apk" || true

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/**/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Build Release APK
        id: build_release
        run: |
          ./gradlew assembleRelease --no-daemon --info --stacktrace 2>&1 | tee gradle-release-build.log || {
            echo "::error title=Release Build Failed::$(tail -n 30 gradle-release-build.log | tr '\n' ' ')"
            exit 1
          }
        continue-on-error: true

      - name: Upload Release APK artifact (if built)
        uses: actions/upload-artifact@v4
        if: steps.build_release.outcome == 'success'
        id: upload-release
        with:
          name: app-release-unsigned
          path: |
            app/build/outputs/apk/release/**/*.apk
            app/build/outputs/**/*.apk
          if-no-files-found: ignore

      - name: Output Failure Summary for Logs
        if: failure()
        run: |
          echo "========================================================"
          echo "         CI BUILD ERROR LOG SUMMARY (LAST 150 LINES)    "
          echo "========================================================"
          if [ -f gradle-debug-build.log ]; then
            echo "=== GRADLE DEBUG BUILD LOG (ERRORS) ==="
            grep -E -C 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:|FAILURE:)" gradle-debug-build.log || true
            echo "=== LAST 120 LINES OF LOG ==="
            tail -n 120 gradle-debug-build.log
          fi
          if [ -f gradle-release-build.log ]; then
            echo "=== GRADLE RELEASE BUILD LOG (ERRORS) ==="
            grep -E -C 3 -i "(e: |error:|FAILED|Exception in thread|Caused by:|FAILURE:)" gradle-release-build.log || true
            echo "=== LAST 120 LINES OF LOG ==="
            tail -n 120 gradle-release-build.log
          fi
          echo "========================================================"

      - name: Create Failure Issue with Full Log
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          LOG_CONTENT="No build log found"
          if [ -f gradle-debug-build.log ]; then
            LOG_CONTENT=$(tail -n 120 gradle-debug-build.log)
          elif [ -f gradle-release-build.log ]; then
            LOG_CONTENT=$(tail -n 120 gradle-release-build.log)
          fi

          SHORT_COMMIT=$(echo "$COMMIT_SHA" | cut -c1-7)
          ISSUE_TITLE="CI Build Failure on $REF_NAME ($SHORT_COMMIT)"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --label "build-failure" \
            --body "### CI Build Failure Log
**Workflow:** $WORKFLOW_NAME
**Commit:** \`$COMMIT_SHA\`
**Run:** [View Run]($RUN_URL)

\`\`\`text
$LOG_CONTENT
\`\`\`" || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-failure-log
          path: |
            gradle-debug-build.log
            gradle-release-build.log
          if-no-files-found: ignore

      - name: Extract Release Tag
        id: tag_name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/**/*.apk
          body: |
            Automated tag build for ${{ steps.tag_name.outputs.tag }}.
            
            ### Artifacts
            - Debug build of GPT Mobile AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
