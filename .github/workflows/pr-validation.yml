name: PR Validation

env:
  OBX_DISABLE_ANALYTICS: "true"

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Android regex compatibility
        run: |
          python3 scripts/check_android_regex.py
          python3 -m unittest discover -s scripts/tests

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Validate gateway Python and contract tests
        run: |
          python3 -m pip install -r gateway/requirements.txt
          python3 -m py_compile gateway/gateway*.py
          python3 gateway/check_gateway.py

      - name: Resource preflight
        run: bash scripts/validate.sh resources

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle Problem Matcher
        run: echo "::add-matcher::.github/gradle-problem-matcher.json"
        continue-on-error: true

      - name: Run Unit Tests & JaCoCo Coverage Report
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --no-daemon --info 2>&1 | tee test.log || (echo "=== TEST FAILURE LOG ===" && tail -n 100 test.log && exit 1)

      - name: Verify exported Room schemas
        if: always()
        run: python3 scripts/check_room_schemas.py

      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --info 2>&1 | tee lint.log || (echo "=== LINT FAILURE LOG ===" && tail -n 100 lint.log && exit 1)

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: "Unit Test Results"
          fail_on_failure: false
          require_tests: false

      - name: Build review APK and verify packaged runtime
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk
          python3 scripts/check_no_telemetry.py app/build/outputs/apk/debug/*.apk

      - name: Upload review APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

      - name: Upload dependency verification failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-verification
          path: '**/build/reports/dependency-verification/'
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate PR Step Summary
        if: always()
        run: |
          echo "## CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test.log ]; then
            TEST_FAILURES=$(grep -E "(FAILURE|FAILED|There were failing tests)" test.log || true)
            if [ -n "$TEST_FAILURES" ]; then
              echo "### ❌ Unit Test Warnings / Failures" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$TEST_FAILURES" | tail -n 20 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Unit Tests Succeeded" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f lint.log ]; then
            LINT_ERRORS=$(grep -E "(Error:|Fatal error:|errors occurred:)" lint.log || true)
            if [ -n "$LINT_ERRORS" ]; then
              echo "### ⚠️ Lint Findings" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$LINT_ERRORS" | tail -n 20 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Android Lint Succeeded" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -d "app/build/reports/jacoco/jacocoTestReport" ]; then
            echo "### 📊 JaCoCo Code Coverage Report Generated" >> $GITHUB_STEP_SUMMARY
          fi
