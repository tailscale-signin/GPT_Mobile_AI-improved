name: Polish MCP picker integration

on:
  push:
    paths:
      - .github/workflows/polish-mcp-picker.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Compose extension import and import ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/dev/chungjungsoo/gptmobile/presentation/ui/setting/McpServerPickerDialog.kt')
          source = path.read_text()
          source = source.replace(
              'import androidx.compose.foundation.layout.width\n',
              'import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.weight\n'
          )
          source = source.replace('import dev.chungjungsoo.gptmobile.R\nimport androidx.compose.ui.res.stringResource\n', '')
          source = source.replace(
              'import androidx.compose.ui.graphics.Color\n',
              'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.res.stringResource\n'
          )
          source = source.replace(
              'import androidx.compose.ui.unit.sp\n',
              'import androidx.compose.ui.unit.sp\nimport dev.chungjungsoo.gptmobile.R\n'
          )
          path.write_text(source)
          Path('.github/workflows/polish-mcp-picker.yml').unlink()
          PY
      - name: Commit polish and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix MCP picker Compose imports"
          git push
