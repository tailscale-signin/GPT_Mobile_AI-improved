name: Setup Android build
description: JDK 21, verified Gradle wrapper, scoped cache and Android 37 SDK
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        validate-wrappers: true
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platforms;android-37.0 build-tools;37.0.0'
    - name: Verify accepted SDK licenses
      shell: bash
      run: |
        set -euo pipefail
        set +o pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1
        sdk_status=${PIPESTATUS[1]}
        set -o pipefail
        cat "$RUNNER_TEMP/sdk-licenses.log"
        test "$sdk_status" -eq 0
        grep -q 'All SDK package licenses accepted' "$RUNNER_TEMP/sdk-licenses.log"
    - name: Enable Gradle wrapper
      shell: bash
      run: chmod +x ./gradlew
    - name: Provision verified memory model outside Gradle
      shell: bash
      run: python3 scripts/provision_memory_model.py
