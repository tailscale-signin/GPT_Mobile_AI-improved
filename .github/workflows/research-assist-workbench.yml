name: Research Assist Workbench

on:
  push:
    branches: [fix/research-local-assist-pipeline-2026-10-13]
    paths:
      - .github/workflows/research-assist-workbench.yml
      - .repair-workbench/**

permissions:
  contents: read

jobs:
  snapshot:
    if: github.ref == 'refs/heads/fix/research-local-assist-pipeline-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar.gz --output=research-assist-source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-assist-source
          path: research-assist-source.tar.gz
          retention-days: 1
          if-no-files-found: error
